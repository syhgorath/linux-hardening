# sshpocket bileşen sözleşmesi (makine-okunur). sshpocket yalnızca bunu okuyup eylemleri çalıştırır.
# Tutarlılık (VERSION, profiller, destek matrisi, değişkenler) scripts/check-consistency.py ile denetlenir.
id: linux-hardening
version: 0.1.0            # VERSION dosyasıyla aynı olmalı
sshpocket_api: 1

requires:
  control:                # komutu çalıştıran makine (Mac)
    python: ">=3.12"      # ansible-core 2.21.5 Requires-Python bilgisiyle aynı
    packages: [ansible-core]   # sürüm/hash: requirements.txt
  target:                 # sertleştirilen sunucu
    python: ">=3.9"       # ansible-core 2.21 modüllerinin hedefte gerektirdiği alt sınır

# Hedef sunucuların inventory'de yazılması gereken grup (eski 'ubuntu' grubu geçiş için kabul edilir).
inventory_group: hardening

profiles:                 # status: supported | planned
  - { id: ubuntu-26.04, status: supported }
  - { id: rpi, status: planned }
  - { id: proxmox, status: planned }

actions:
  # effects: [] | installs-package | changes-config
  audit:
    cmd: "ansible-playbook playbooks/audit.yml"
    effects: [installs-package]        # hedefe lynis paketini kurar; yapılandırmayı değiştirmez
    requires_sudo: true
    outputs:
      dir_var: hardening_scan_dir      # varsayılan: scans/ (repo içinde)
      summary: "<dir>/<host>/<tarih>/summary.json"
  preview:
    cmd: "ansible-playbook playbooks/harden.yml --check --diff"
    effects: []
    requires_sudo: true
  apply:
    cmd: "ansible-playbook playbooks/harden.yml"
    effects: [installs-package, changes-config]
    requires_sudo: true
    requires: [preview]                # sshpocket önce preview çalıştırıp göstermeli

  # Geri alma güvenlik ağı (hardening_rollback): kontrol kaybından sonra durumu görmek ve iptal etmek için.
  # Bu eylemler preflight/erişim korumalarını çalıştırmaz (kontrol kaybından sonra da çalışabilmeli).
  rollback_status:
    cmd: "ansible-playbook playbooks/rollback.yml"
    effects: []
    requires_sudo: true
  rollback_disarm:
    cmd: "ansible-playbook playbooks/rollback.yml --tags disarm"
    effects: [changes-config]            # geri alma güvenlik ağını iptal eder (zamanlayıcı/yedek silinir)
    requires_sudo: true
  rollback_now:
    cmd: "ansible-playbook playbooks/rollback.yml --tags now"
    effects: [changes-config]            # armed ise sunucuyu hemen önceki duruma döndürür
    requires_sudo: true

# sshpocket'in -e ile verebileceği değişkenler (sshpocket paket standardı §6). hardening_ssh_port YOKTUR (kaldırıldı,
# port değiştirme desteklenmiyor). Varsayılanlar rollerin defaults/main.yml değerleriyle AYNI olmalı
# (scripts/check-consistency.py denetler); min/max sınırlarını bileşen sahibi belirler.
vars:
  - name: hardening_ssh_allow_from
    type: list[cidr]
    required: true                     # boşken harden.yml (ufw/ssh) durur; varsayılan yok
    description: "SSH'a izin verilen yönetim ağları (CIDR listesi); kontrol makinesinin sunucudan görünen adresi bu listede olmalı"
  - name: hardening_scan_dir
    type: path
    description: "Lynis raporları ve summary.json buraya yazılır (hassas veri; dizin 0700, dosyalar 0600). Verilmezse bileşen içindeki scans/ kullanılır"
  - name: hardening_rollback_enabled
    type: bool
    default: true
    warn_if: false                     # false = geri alma güvenlik ağı KAPALI (bilinçli kaçış)
    description: "false: sunucu erişim kaybında kendini geri ALMAZ; yalnızca ne yaptığınızı biliyorsanız"
  - name: hardening_rollback_timeout
    type: int
    default: 300
    min: 30
    max: 3600
    description: "Doğrulanmazsa sunucunun kendini geri alma süresi (saniye); aralık dışı değerde playbook ufw/ssh değişmeden durur"

# sshpocket'in yukarıdaki cmd'nin sonuna eklediği argümanlar.
invoke:
  append:
    - { arg: "-i", value: "<üretilen geçici inventory>", required: true }
    - { arg: "--limit", value: "<sunucu>", required: true }
    - { arg: "--ask-become-pass", required: true, interactive: true }   # sudo parolasını Ansible kendi istemiyle alır
    - { arg: "-e", value: "@<değişken dosyası>", required: false }      # örn. hardening_ssh_allow_from
