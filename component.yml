# sshpocket bileşen sözleşmesi (makine-okunur). sshpocket yalnızca bunu okuyup eylemleri çalıştırır.
# Tutarlılık (VERSION, profiller, destek matrisi, değişkenler) scripts/check-consistency.py ile denetlenir.
# component.json bu dosyadan TÜRETİLİR (python3 scripts/make-component-json.py) ve pakete o girer; elle düzenlemeyin.
id: linux-hardening
version: 0.3.0            # VERSION dosyasıyla aynı olmalı
sshpocket_api: 1          # sshpocket paket standardı v1 (docs/package-standard.md, sshpocket reposu)
name: "Linux sertleştirme"
description: "Ubuntu sunucuları Ansible ile sertleştirir (SSH, ufw, kernel, auditd, fail2ban, AIDE); Lynis denetimi ve geri alma güvenlik ağı içerir"
runner: ansible           # eylemler ansible-playbook ile çalışır; inventory, -e @dosya ve çalışma dizini sshpocket'ten gelir

requires:
  control:                # komutu çalıştıran makine (Mac)
    python: ">=3.12"      # ansible-core 2.21.5 Requires-Python bilgisiyle aynı
    packages: [ansible-core]   # sürüm/hash: requirements.txt
  target:                 # sertleştirilen sunucu
    python: ">=3.9"       # ansible-core 2.21 modüllerinin hedefte gerektirdiği alt sınır

# Hedef sunucuların inventory'de yazılması gereken grup (eski 'ubuntu' grubu geçiş için kabul edilir).
inventory_group: hardening

profiles:                 # status: supported | planned
  - { id: ubuntu-26.04, status: supported }
  - { id: rpi, status: planned }
  - { id: proxmox, status: planned }

actions:
  # effects: [] | installs-package | changes-config
  # confirm: none | yes-no | type-server-name. sshpocket asgari kuralı uygular (effects boş değilse en az yes-no);
  # paket yalnızca sıkılaştırabilir. warnings: eylem menüsünde gösterilen açık notlar.
  audit:
    cmd: "ansible-playbook playbooks/audit.yml"
    effects: [installs-package]        # hedefe lynis paketini kurar; yapılandırmayı değiştirmez
    requires_sudo: true
    confirm: yes-no                    # installs-package olduğu için asgari kural zaten yes-no
    warnings:
      - "Hedefe lynis paketini kurar; yapılandırmayı değiştirmez."
      - "Rapor ve summary.json hassas veri içerir (hardening_scan_dir; dizin 0700, dosyalar 0600)."
    outputs:
      dir_var: hardening_scan_dir      # sshpocket verir; verilmezse kullanıcı klasörü (~/.local/share/linux-hardening/scans)
      summary: "<dir>/<host>/<tarih>/summary.json"
  preview:
    cmd: "ansible-playbook playbooks/harden.yml --check --diff"
    effects: []
    requires_sudo: true
    confirm: none
    warnings:
      - "hardening_ssh_allow_from eksikse bunu önizlemede göremezsin (ufw komutları --check'te çalışmaz): sunucuya bağlanabileceğin TÜM ağları (VPN + LAN + ...) yaz; yalnızca VPN yazarsan ufw LAN'dan SSH'ı keser."
      - "Önizleme ufw (firewall) değişikliğini göstermez: ufw komutları --check modunda çalışmaz."
      - "Önizleme servis durumunu (auditd, fail2ban başlatma) göstermez."
      - "Erişim kaybı korumaları (hardening_ssh_allow_from, kaynak IP, root kontrolü) önizlemede de çalışır ve durdurabilir."
  apply:
    cmd: "ansible-playbook playbooks/harden.yml"
    effects: [installs-package, changes-config]
    requires_sudo: true
    requires: [preview]                # sshpocket önce preview çalıştırıp göstermeli
    confirm: type-server-name
    warnings:
      - "hardening_ssh_allow_from'a sunucuya BAĞLANABİLECEĞİN TÜM ağları yaz (VPN + LAN + ...). ufw yalnızca bunlardan SSH'a izin verir; yalnızca VPN yazarsan LAN'dan SSH kesilir (ping/ARP çalışır, ssh zaman aşar) ve geri alma güvenlik ağı bunu yakalamaz."
      - "SSH ve ufw kurallarını değiştirir; bağlantınız kopabilir. Çalıştırmadan önce anahtarın ssh-agent'ta olduğunu doğrulayın (ssh-add -l)."
      - "Geri alma güvenlik ağı yalnızca SSH drop-in ve ufw'yi geri alır; paketler, sysctl, auditd, fail2ban ve AIDE geri alınmaz."
      - "Doğrulama başarısız olursa ya da bağlantı kaybolursa sunucu hardening_rollback_timeout sn sonra kendini önceki duruma döndürür; o sürede erişim olmayabilir."
      - "hardening_rollback_enabled=false güvenlik ağını kapatır."

  # Geri alma güvenlik ağı (hardening_rollback): kontrol kaybından sonra durumu görmek ve iptal etmek için.
  # Bu eylemler preflight/erişim korumalarını çalıştırmaz (kontrol kaybından sonra da çalışabilmeli).
  rollback_status:
    cmd: "ansible-playbook playbooks/rollback.yml"
    effects: []
    requires_sudo: true
    outputs:                             # Ansible çıktı biçiminden bağımsız tek satır (sshpocket paket standardı §8)
      format: keyvalue-line
      prefix: "SSHPOCKET_RESULT linux-hardening.rollback_status"
      keys: [installed, armed, timer, remaining_seconds, timeout_seconds]
    confirm: none
    warnings:
      - "Salt okunur: yalnızca geri alma güvenlik ağının durumunu gösterir. Betik kurulu değilse installed=no döner."
  rollback_disarm:
    cmd: "ansible-playbook playbooks/rollback.yml --tags disarm"
    effects: [changes-config]            # geri alma güvenlik ağını iptal eder (zamanlayıcı/yedek silinir)
    requires_sudo: true
    confirm: type-server-name
    warnings:
      - "Geri almayı İPTAL eder: zamanlayıcı ve önceki durum yedeği silinir; sonrasında sunucu kendini geri almaz."
      - "Yalnızca değişikliğin iyi olduğundan ve erişiminizin sağlam olduğundan eminseniz kullanın."
  rollback_now:
    cmd: "ansible-playbook playbooks/rollback.yml --tags now"
    effects: [changes-config]            # armed ise sunucuyu hemen önceki duruma döndürür
    requires_sudo: true
    confirm: type-server-name
    warnings:
      - "SSH drop-in ve ufw kurallarını değişiklikten ÖNCEKİ duruma döndürür; diğer roller (sysctl, auditd, fail2ban, AIDE, paketler) geri alınmaz."
      - "Geri alma güvenlik ağı kurulu ve armed değilse hiçbir şey yapmaz."

# sshpocket'in -e ile verebileceği değişkenler (sshpocket paket standardı §6). hardening_ssh_port YOKTUR (kaldırıldı,
# port değiştirme desteklenmiyor). Varsayılanlar rollerin defaults/main.yml değerleriyle AYNI olmalı
# (scripts/check-consistency.py denetler); min/max sınırlarını bileşen sahibi belirler.
vars:
  - name: hardening_ssh_allow_from
    type: list[cidr]
    required: true                     # boşken harden.yml (ufw/ssh) durur; varsayılan yok
    description: "SSH'a izin verilen yönetim ağları (CIDR listesi). Sunucuya BAĞLANABİLECEĞİN TÜM ağları yaz (VPN + LAN + ...): ufw yalnızca bunlardan SSH'a izin verir, yalnızca VPN yazarsan LAN'dan SSH kesilir. Kontrol makinesinin sunucudan görünen adresi de listede olmalı"
  - name: hardening_scan_dir
    type: path
    description: "Lynis raporları ve summary.json buraya yazılır (hassas veri; dizin 0700, dosyalar 0600). Verilmezse kullanıcı klasörü kullanılır (~/.local/share/linux-hardening/scans, XDG_DATA_HOME varsa onun altı), paket klasörü değil"
  - name: hardening_time_report
    type: bool
    default: true
    description: "Salt okunur zaman raporu: chrony çalışıyor mu, kaynaklar seçili mi, saat kaynaklara göre kayık mı (snapshot dönüşünde 'synchronized: yes' yanıltıcı olabilir). Saati ya da yapılandırmayı DEĞİŞTİRMEZ; false = rapor çalışmaz"
  - name: hardening_time_max_offset_seconds
    type: int
    default: 5
    min: 1
    max: 86400
    description: "Kaynakların ölçtüğü ofset bu saniyeyi aşarsa zaman raporu uyarır"
  - name: hardening_ufw_extra_allow
    type: list[string]
    default: []
    description: "Gelen trafikte ek açılacak portlar/kurallar (varsayılan: hepsi kapalı). Biçimler: \"443/tcp\", \"80\", \"8000:8010/tcp\" ya da kaynak kısıtlı \"from 192.0.2.5 to any port 6379 proto tcp\" (kaynak: IP, CIDR ya da any). Geçersiz girdi hiçbir rol çalışmadan reddedilir. Ansible'da sunucuya özel kurallar için hardening_ufw_extra_allow_host (grupla birleşir)"
  - name: hardening_ufw_prune_ssh
    type: bool
    default: false
    warn_if: true                      # true = allow_from'da olmayan eski SSH kurallarını SİLER
    description: "false (varsayılan): allow_from'da olmayan, bu rolün yazdığı biçimdeki ufw SSH kurallarını yalnızca uyarır. true: bunları siler (kontrol makinesinin adresini kapsayanlara dokunmaz; silmeden sonra eksik kural varsa ufw'yi etkinleştirmeden durur)"
  - name: hardening_apt_listchanges
    type: bool
    default: true
    description: "true (varsayılan): apt-listchanges kurulur ve yükseltmeyi bloklamayacak şekilde ayarlanır (frontend=text, confirm=false, e-posta yok); değişiklik notları apt çıktısında/günlüğünde görünür. Bilgilendirmedir. apt-listbugs Ubuntu'da yoktur ve eklenmez. false: kurulmaz (kurulu paket kaldırılmaz)"
  - name: hardening_kernel_extra_sysctl
    type: bool
    default: true
    description: "true (varsayılan): üç ek sysctl: fs.protected_fifos=2, kernel.sysrq=0 (VM konsolundan SysRq acil yeniden başlatma kullanılamaz), net.core.bpf_jit_harden=2 (eBPF yoğun iş yüklerinde küçük performans bedeli). false: yazılmaz"
  - name: hardening_pam_tmpdir
    type: bool
    default: true
    description: "true (varsayılan): libpam-tmpdir kurulur; her oturum özel 0700 bir geçici dizin (/tmp/user/<uid>) ve $TMPDIR alır. /tmp'i sabit varsayan betikler etkilenebilir. false: kurulmaz (kurulu paket kaldırılmaz)"
  - name: hardening_aide_scheduled_check
    type: bool
    default: true
    description: "true (varsayılan): aide-common'ın günlük kontrol zamanlayıcısı (dailyaidecheck.timer) açık ve başlatılmış olur (CIS 6.3.2); paket zaten açık kurar, biri kapattıysa geri açılır. Zamanlayıcının işi değişmez (veritabanı kendiliğinden güncellenmez; e-posta teslim edilmez, sonuç /var/log/aide/). false: zamanlayıcıya dokunulmaz"
  - name: hardening_su_restrict
    type: bool
    default: false
    warn_if: true                      # true = /etc/pam.d/su'ya pam_wheel eklenir (kök olmayan hesaplar su yapamaz)
    description: "true: su yalnızca hardening_su_group üyelerine açılır (CIS 5.2.7). Grup yoksa BOŞ oluşturulur: root dışında kimse su yapamaz (root pam_rootok ile geçer). sudo, ssh ve konsol girişi etkilenmez; kök olmayan hesapla su çağıran betikler/insanlar bozulur. Geri almak için /etc/pam.d/su'daki pam_wheel satırını silin. Varsayılan kapalı"
  - name: hardening_su_group
    type: string
    default: sugroup
    description: "su yapabilecek grup (hardening_su_restrict=true iken). Varsayılan sugroup boş oluşturulur (en sıkı). Mevcut bir gruba (örn. sudo) çevrilirse o grubun üyeleri su yapabilir. Küçük harf, rakam, _ ve -; en çok 32 karakter"
  - name: hardening_root_env_report
    type: bool
    default: true
    description: "true (varsayılan): root ortamı SALT OKUNUR raporu (CIS 5.4.2: root PATH bütünlüğü ve root umask): PATH'te boş girdi, '.', olmayan ya da yazılabilir dizin ve 027'den gevşek umask uyarılır. Hiçbir şeyi değiştirmez. false: rapor çalışmaz"
  - name: hardening_tmp_report
    type: bool
    default: true
    description: "true (varsayılan): /tmp ve /dev/shm bağlama seçenekleri SALT OKUNUR raporu (CIS 1.1.2: ayrı bağlama, nodev, nosuid, noexec). Hiçbir şeyi değiştirmez; noexec yoksa yalnızca not düşer, nodev/nosuid yoksa, ayrı bağlama değilse ya da Ansible remote_tmp /tmp altındaysa uyarır. false: rapor çalışmaz"
  - name: hardening_docker_enabled
    type: bool
    default: false
    warn_if: true                      # true = Docker rolü çalışır (kurulu değilse atlanır)
    description: "true: Docker rolü çalışır (Docker kurulu değilse atlanır): docker grubu, herkese yayınlanan portlar, TCP API ve tehlikeli daemon.json ayarları için SALT OKUNUR rapor. Dosya izinleri ve auditd kuralları Docker kuruluysa zaten ayrıca uygulanır. Varsayılan kapalı"
  - name: hardening_docker_daemon_manage
    type: bool
    default: false
    warn_if: true                      # true = /etc/docker/daemon.json'a anahtar birleştirilir
    description: "true: daemon.json'a live-restore ve günlük boyutu sınırı gibi anahtarlar BİRLEŞTİRİLİR (mevcut anahtarlar korunur, yedek alınır; geçersiz JSON'a dokunulmaz). Değişiklik çoğu zaman Docker yeniden başlatması ister. Varsayılan kapalı"
  - name: hardening_docker_no_new_privileges
    type: bool
    default: false
    warn_if: true                      # true = daemon.json'a no-new-privileges yazılır (konteyner içinde setuid kullanan süreçler bozulur)
    description: "true: daemon.json'a no-new-privileges (CIS Docker 2.15) yazılır; konteyner içinde setuid ikili kullanan süreçler (örn. sudo) bozulur. Yalnızca hardening_docker_daemon_manage=true iken etkilidir; yeniden başlatma ister. Varsayılan kapalı"
  - name: hardening_docker_userland_proxy_off
    type: bool
    default: false
    warn_if: true                      # true = daemon.json'a userland-proxy=false yazılır (bazı ağ düzenleri etkilenir)
    description: "true: daemon.json'a userland-proxy=false (CIS Docker 2.17) yazılır; docker-proxy yerine iptables kullanılır, bazı ağ düzenlerinde ('hairpin NAT') fark eder. Yalnızca hardening_docker_daemon_manage=true iken etkilidir; yeniden başlatma ister. Varsayılan kapalı"
  - name: hardening_docker_icc_off
    type: bool
    default: false
    warn_if: true                      # true = daemon.json'a icc=false yazılır (varsayılan köprüde konteynerler birbirine ulaşamaz)
    description: "true: daemon.json'a icc=false (CIS Docker 2.2) yazılır; varsayılan köprüdeki konteynerler birbirine ulaşamaz (kendi ağını kullanan compose projeleri çoğunlukla etkilenmez, eski --link bozulur). Yalnızca hardening_docker_daemon_manage=true iken etkilidir; yeniden başlatma ister. Varsayılan kapalı"
  - name: hardening_docker_restart
    type: bool
    default: false
    warn_if: true                      # true = daemon.json değişince Docker yeniden başlatılır (konteynerler durabilir)
    description: "true: daemon.json değişince Docker yeniden başlatılır; live-restore yoksa konteynerler DURUR. false: yalnızca 'yeniden başlatma gerekli' uyarısı. Varsayılan kapalı"
  - name: hardening_docker_allowed_published
    type: list[int]
    default: [80, 443]
    description: "Her arayüze yayınlanmasına izin verilen konteyner portları (ters vekil). Başka bir port 0.0.0.0'a yayınlanırsa rapor uyarır (Docker ufw'yi atlar). Varsayılan 80 ve 443"
  - name: hardening_disable_usb_storage
    type: bool
    default: true
    warn_if: false                     # false = usb-storage engellenmez (kural dosyası silinir)
    description: "true (varsayılan): usb-storage çekirdek modülü yüklenemez (CIS); USB diske yedek/kurtarma çalışmaz. false: bu rolün yazdığı kural dosyası silinir, USB depolama tekrar kullanılabilir"
  - name: hardening_disable_coredump
    type: bool
    default: false
    warn_if: true                      # true = çökme dökümü (core dump) alınmaz
    description: "true: core dump'lar kapatılır (limits.d ve systemd-coredump). Bir süreç çöktüğünde döküm OLMAZ, hata ayıklama zorlaşır. Varsayılan kapalı"
  - name: hardening_remove_legacy_clients
    type: bool
    default: false
    warn_if: true                      # true = telnet/ftp istemcileri KALDIRILIR
    description: "true: telnet ve ftp istemcileri kaldırılır (apt remove; purge değil, geri alma apt install). Port açmazlar ama telnet ile port yoklayan betikleri ve ftp yedek akışlarını KIRAR. Varsayılan kapalı"
  - name: hardening_shell_timeout_seconds
    type: int
    default: 0
    min: 0
    max: 900
    description: "Etkileşimli kabuk boşta kalma süresi (saniye, TMOUT); 0 = kapalı (varsayılan). Açılınca boşta kalan kabuk oturumları kapanır"
  - name: hardening_password_inactive_days
    type: int
    default: 0
    min: 0
    max: 365
    description: "Parola süresi dolduktan sonra hesabın kilitleneceği gün (INACTIVE); 0 = kapalı (varsayılan). YENİ hesaplar için varsayılan yapılır, mevcutlara dokunulmaz (farklı olanlar uyarılır)"
  - name: hardening_log_file_permissions
    type: bool
    default: false
    warn_if: true                      # true = /var/log dosyalarının grup/diğer izinleri kısılır
    description: "true: /var/log altındaki dosyalarda grup yazma ve diğer erişim kaldırılır (wtmp/btmp/lastlog/faillog ve journal hariç). adm grubunda olmayan okuyucular (izleme/log ajanları) bazı günlükleri okuyamaz. Varsayılan kapalı"
  - name: hardening_disable_apport
    type: bool
    default: true
    # warn_if YOK: varsayılan zaten true; uyarı, kullanıcı hiçbir şeyi değiştirmediği hâlde her çalıştırmada onay isterdi (#74). Etki README 'Dikkat' ve known-issues'ta.
    description: "true: Ubuntu hata raporlayıcı apport kapatılır (enabled=0, servis durdurulup maskelenir; CIS 1.5.7). Çökme raporları toplanmaz. false: dokunulmaz"
  - name: hardening_disable_update_notifier_motd
    type: bool
    default: true
    # warn_if YOK: varsayılan zaten true (bkz. hardening_disable_apport, #74).
    description: "true: update-notifier-motd zamanlayıcısı durdurulup maskelenir (CIS 1.6.12); oturum açılışındaki güncelleme iletisi yenilenmez. false: dokunulmaz"
  - name: hardening_suid_report
    type: bool
    default: true
    warn_if: false                     # false = SUID/SGID özeti yazdırılmaz
    description: "true: SUID/SGID dosyalarının SALT OKUNUR özetini yazdırır (CIS 7.1.13); hiçbir şeyi değiştirmez, en çok 120 sn sürer. false: çalışmaz"
  - name: hardening_files_enabled
    type: bool
    default: true
    warn_if: false                     # false = dosya izinleri sıkılaştırılmaz
    description: "true: CIS dosya izinleri (passwd/shadow/group, sshd_config, ana bilgisayar anahtarları, cron, grub.cfg) yalnızca fazla izin KALDIRILARAK sıkılaştırılır; olmayan dosya oluşturulmaz. false: rol hiçbir şey yapmaz"
  - name: hardening_sudo_enabled
    type: bool
    default: true
    warn_if: false                     # false = sudo ayarı yazılmaz
    description: "true: /etc/sudoers.d/60-hardening yazılır (use_pty, logfile, timestamp_timeout=15; visudo ile doğrulanır). use_pty, arka plana atılan sudo süreçlerinin oturum kapanınca takılmasına yol açabilir. false: rol hiçbir şey yapmaz"
  - name: hardening_kernel_disable_ipv6_ra
    type: bool
    default: false
    warn_if: true                      # true = IPv6 yönlendirici duyurularını (RA) kabul etmez
    description: "true: IPv6 yönlendirici duyurularını (accept_ra = 0) kapatır (CIS 3.3.2, accept_ra). IPv6 adresini/yolunu yalnızca RA'dan alan sunucu IPv6 bağlantısını KAYBEDER"
  - name: hardening_ufw_routed_deny
    type: bool
    default: true
    warn_if: false                     # false = ufw'nin routed ilkesine dokunulmaz
    description: "true: yönlendirilen (forward) trafik için ufw varsayılanı deny (CIS 4.1.5; Ubuntu'da zaten böyledir). false: dokunulmaz; ufw ile yönlendirme/NAT yapan ve bunu ACCEPT bırakmış sunucular için"
  - name: hardening_auditd_restart_services
    type: list[string]
    default: []
    description: "Kurallar yüklendikten sonra yeniden başlatılacak servisler (auditd'den önce başlayanlar yeniden başlatılana kadar denetlenmez). Boş = hiçbiri. Servis kesintisi yaratır; ssh/sshd yazılamaz (rol reddeder)"
  - name: hardening_auditd_grub_audit
    type: bool
    default: false
    warn_if: true                      # true = GRUB'a audit=1 yazar, yeniden başlatma gerekir, geri alma kapsamında değil
    description: "true: GRUB_CMDLINE_LINUX'a audit=1 ekler ve update-grub çalıştırır; etkisi YENİDEN BAŞLATMADAN sonra başlar ve geri alma güvenlik ağı kapsamında DEĞİLDİR (elle geri alınır)"
  - name: hardening_rollback_enabled
    type: bool
    default: true
    warn_if: false                     # false = geri alma güvenlik ağı KAPALI (bilinçli kaçış)
    description: "false: sunucu erişim kaybında kendini geri ALMAZ; yalnızca ne yaptığınızı biliyorsanız"
  - name: hardening_rollback_timeout
    type: int
    default: 300
    min: 30
    max: 3600
    description: "Doğrulanmazsa sunucunun kendini geri alma süresi (saniye); aralık dışı değerde playbook ufw/ssh değişmeden durur"

# sshpocket'in yukarıdaki cmd'nin sonuna eklediği EK bayraklar. -i (geçici inventory), --limit (sunucu) ve -e @dosya
# (değişkenler) burada YOKTUR: runner: ansible için bunları sshpocket çalıştırıcısı kendisi ekler (paket standardı §7, §14 madde 7);
# invoke.append içinde geçerse yok sayılırlar, cmd içinde geçerse paket reddedilir. Denetim: scripts/check-consistency.py.
invoke:
  append:
    - { arg: "--ask-become-pass", required: true, interactive: true }   # sudo parolasını Ansible kendi istemiyle alır
