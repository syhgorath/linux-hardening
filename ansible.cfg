[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
result_format = yaml
# ansible-core 2.24'te varsayılan False olacak: fact'ler yalnızca ansible_facts[...] ile okunur (#36). Şimdiden zorla.
inject_facts_as_vars = False

[privilege_escalation]
become = True
become_method = sudo
