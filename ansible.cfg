[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
result_format = yaml
# SSHPOCKET_PROGRESS satırları (docs/ilerleme-satirlari.md). Yol bu dosyaya göredir; sshpocket'ten bağımsız, elle ansible-playbook ile de çalışır.
callbacks_enabled = sshpocket_progress
callback_plugins = ./callback_plugins
# ansible-core 2.24'te varsayılan False olacak: fact'ler yalnızca ansible_facts[...] ile okunur (#36). Şimdiden zorla.
inject_facts_as_vars = False

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# Ölü bir TCP bağlantısında (ağ değişti, Mac uyudu) ansible-playbook saatlerce takılmasın: 15 sn x 3 = ~45 sn yanıt gelmezse bağlantı düşer ve görev UNREACHABLE olur.
# ssh_args'ı EZMİYORUZ (Ansible'ın ControlMaster/ControlPersist varsayılanları kalır); yalnızca ek seçenek veriyoruz.
# Gerçek vaka: v0.3.0 doğrulamasında kontrol makinesi ağ değiştirdi ve koşu 14 dakika takılı kaldı (docs/verification-log.md madde 19).
ssh_extra_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3

