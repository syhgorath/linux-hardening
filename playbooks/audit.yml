# Baseline tarama. Sistem ayarlarini degistirmez; sadece lynis paketini kurar.
# Rapor: scans/<host>/<tarih>/lynis-report.dat ve lynis.log
- name: Audit (Lynis)
  hosts: ubuntu
  pre_tasks:
    - ansible.builtin.include_role:
        name: hardening_preflight
      tags: [always]
  tasks:
    - name: Fix scan directory for this run
      ansible.builtin.set_fact:
        scan_dir: "{{ playbook_dir }}/../scans/{{ inventory_hostname }}/{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
      delegate_to: localhost

    - name: Install lynis
      ansible.builtin.apt:
        name: lynis
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Run lynis audit
      ansible.builtin.command: lynis audit system --quiet --no-colors
      register: lynis_run
      changed_when: false
      failed_when: lynis_run.rc not in [0, 1]

    - name: Fetch report and log
      ansible.builtin.fetch:
        src: "/var/log/{{ item }}"
        dest: "{{ scan_dir }}/{{ item }}"
        flat: true
      loop:
        - lynis-report.dat
        - lynis.log
