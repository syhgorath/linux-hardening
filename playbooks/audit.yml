# Baseline tarama. Sistem ayarlarini degistirmez; sadece lynis paketini kurar.
# Rapor: <hardening_scan_dir>/<host>/<tarih>/lynis-report.dat ve lynis.log (varsayılan konum: aşağıda)
- name: Audit (Lynis)
  # Genel grup 'hardening' (dışarıdan üretilen inventory'ler bunu kullanır); eski 'ubuntu' grubu geçiş için
  # kabul edilir. Sistem/sürüm desteği hardening_preflight ile kontrol edilir, grup adıyla değil.
  # Yalnızca envanterde VAR olan gruplar seçilir: olmayan grup için "Could not match supplied host pattern" uyarısı çıkmaz (#35).
  # İkisi de yoksa "hardening" kalır (tek, anlamlı uyarı).
  hosts: "{{ ['hardening', 'ubuntu'] | select('in', groups) | join(':') or 'hardening' }}"
  pre_tasks:
    - name: Preflight (desteklenen OS/sürüm, sürüm değişkenleri)
      ansible.builtin.include_role:
        name: hardening_preflight
        # include_role'daki tags yalnızca include ifadesine uygulanır; içteki görevler --tags ile atlanırdı.
        apply:
          tags: [always]
      tags: [always]
  tasks:
    # Tarama çıktısı konumu: hardening_scan_dir; verilmezse KULLANICI klasörü (paket klasörü USB/paylaşımlı olabilir ve rapor hassastır, #37):
    #   $XDG_DATA_HOME/linux-hardening/scans, yoksa $HOME/.local/share/linux-hardening/scans
    # Altında <host>/<tarih>/ oluşur; varsayılan konumda uygulama dizini ve scans/ 0700, <host> ve <tarih> dizinleri 0700, dosyalar 0600
    # yapılır (rapor hostname, paket, kullanıcı adı içerir). Kullanıcının verdiği özel yolun kendi izinlerine dokunulmaz.
    - name: Scan directory must be resolvable (HOME ya da XDG_DATA_HOME ya da hardening_scan_dir)
      ansible.builtin.assert:
        that:
          - (hardening_scan_dir | default('')) | length > 0 or (lookup('ansible.builtin.env', 'XDG_DATA_HOME') | length > 0) or (lookup('ansible.builtin.env', 'HOME') | length > 0)
        fail_msg: >-
          Tarama dizini belirlenemedi: hardening_scan_dir verilmemiş ve ne XDG_DATA_HOME ne de HOME tanımlı.
          -e hardening_scan_dir=/yol/scans ile verin.
      delegate_to: localhost
      become: false

    - name: Fix scan directory for this run
      ansible.builtin.set_fact:
        hardening_scan_dir_is_default: "{{ (hardening_scan_dir | default('')) | length == 0 }}"
        scan_dir: >-
          {{ (hardening_scan_dir | default('')) if (hardening_scan_dir | default('')) | length > 0
          else ((lookup('ansible.builtin.env', 'XDG_DATA_HOME') | default('', true))
          or (lookup('ansible.builtin.env', 'HOME') ~ '/.local/share')) ~ '/linux-hardening/scans' }}/{{ inventory_hostname }}/{{
          lookup('pipe', 'date +%Y%m%d-%H%M%S') }}
      delegate_to: localhost

    - name: Install lynis
      ansible.builtin.apt:
        name: lynis
        state: present
        update_cache: true
        cache_valid_time: 3600

    # --check modunda lynis kurulmaz (simüle edilir), bu yüzden tarama/toplama/özet ATLANIR.
    - name: Note that check mode does not scan
      ansible.builtin.debug:
        msg: "--check modunda tarama yapılmaz (lynis kurulmaz); rapor ve summary.json üretilmez."
      when: ansible_check_mode

    - name: Run lynis audit
      ansible.builtin.command: lynis audit system --quiet --no-colors
      register: lynis_run
      changed_when: false
      failed_when: lynis_run.rc not in [0, 1]
      when: not ansible_check_mode

    - name: Create scan directories (host ve tarih dizinleri 0700)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      # Varsayılan (kullanıcı klasörü) konumda uygulama dizini ve scans/ da 0700; verilen özel yolun dizinine dokunulmaz.
      loop: >-
        {{ ([{'path': scan_dir | dirname | dirname | dirname, 'mode': '0700'}] if (hardening_scan_dir_is_default | default(false)) else [])
        + [{'path': scan_dir | dirname | dirname, 'mode': ('0700' if (hardening_scan_dir_is_default | default(false)) else none)},
        {'path': scan_dir | dirname, 'mode': '0700'},
        {'path': scan_dir, 'mode': '0700'}] }}
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    - name: Fetch report and log
      ansible.builtin.fetch:
        src: "/var/log/{{ item }}"
        dest: "{{ scan_dir }}/{{ item }}"
        flat: true
      loop:
        - lynis-report.dat
        - lynis.log
      when: not ansible_check_mode

    - name: Restrict fetched files to owner (0600)
      ansible.builtin.file:
        path: "{{ scan_dir }}/{{ item }}"
        mode: "0600"
      loop:
        - lynis-report.dat
        - lynis.log
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    # summary.json: yalnızca sayılar ve envanterdeki ana makine adı (gizli bilgi yok). Alanlar lynis-report.dat'tan:
    #   hardening_index   <- "hardening_index=" satırı
    #   tests_performed   <- "tests_executed=" satırındaki '|' ile ayrılmış test kimliği sayısı
    #   warnings          <- "warning[]=" satırlarının sayısı
    #   suggestions       <- "suggestion[]=" satırlarının sayısı
    # Alan raporda yoksa değer null olur (0 değil). date: özetin üretildiği an, UTC ISO 8601.
    - name: "Summary: read report on the controller"
      ansible.builtin.set_fact:
        hardening_audit_report: "{{ lookup('ansible.builtin.file', scan_dir ~ '/lynis-report.dat') }}"
      delegate_to: localhost
      when: not ansible_check_mode

    - name: "Summary: extract fields"
      ansible.builtin.set_fact:
        hardening_audit_idx: "{{ hardening_audit_report | regex_search('(?m)^hardening_index=([0-9]+)', '\\1', multiline=True) }}"
        hardening_audit_tests: "{{ hardening_audit_report | regex_search('(?m)^tests_executed=(.*)$', '\\1', multiline=True) }}"
        hardening_audit_warnings: "{{ hardening_audit_report | regex_findall('(?m)^warning\\[\\]=', multiline=True) | length }}"
        hardening_audit_suggestions: "{{ hardening_audit_report | regex_findall('(?m)^suggestion\\[\\]=', multiline=True) | length }}"
      delegate_to: localhost
      when: not ansible_check_mode

    - name: "Summary: write summary.json (0600)"
      ansible.builtin.copy:
        dest: "{{ scan_dir }}/summary.json"
        mode: "0600"
        content: |
          {{ {
            'host': inventory_hostname,
            'date': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'),
            'hardening_index': (hardening_audit_idx | first | int) if hardening_audit_idx else none,
            'tests_performed': (hardening_audit_tests | first).split('|') | select | list | length
                               if hardening_audit_tests else none,
            'warnings': hardening_audit_warnings | int,
            'suggestions': hardening_audit_suggestions | int
          } | to_nice_json }}
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    # bulgular.tsv: Lynis uyarı/önerileri tablo olarak (docs/bulgular-sema.md). Hata verirse atlanır, denetimi etkilemez.
    - name: Write the findings table
      ansible.builtin.include_tasks: tasks/bulgular.yml
      when: not ansible_check_mode
