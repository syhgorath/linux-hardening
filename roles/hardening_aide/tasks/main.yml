- name: Install AIDE
  ansible.builtin.apt:
    name: [aide, aide-common]
    state: present
  register: hardening_aide_install

# Proxmox VE: /etc/pve (pmxcfs, FUSE, sürekli değişir), VM/ISO/yedek deposu ve küme veritabanı AIDE'ye alınmaz (yoksa ilk veritabanı saatler sürer ve her gün gürültü çıkar).
# Veritabanı İLK kez üretilmeden ÖNCE yazılmalıdır. Liste `hardening_aide_pve_excludes`; DENENMEDİ: gerçek AIDE veritabanı süresi Proxmox'ta doğrulanmadı.
- name: Make sure the AIDE config drop-in directory exists (Proxmox VE)
  ansible.builtin.file:
    path: /etc/aide/aide.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardening_platform | default('generic') == 'proxmox-host'

- name: Exclude Proxmox VE state and guest storage from AIDE
  ansible.builtin.copy:
    dest: /etc/aide/aide.conf.d/99_hardening_pve_excludes
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible tarafından yönetilir (Proxmox VE): hipervizöre özgü, sürekli değişen ya da büyük yollar taranmaz.
      {% for p in hardening_aide_pve_excludes %}
      !{{ p }}
      {% endfor %}
  when: hardening_platform | default('generic') == 'proxmox-host'

# CIS 6.3.3 (Level 2; varsayılan KAPALI): audit araçları kriptografik özetle korunur. AIDE, kural dosyaları arasında İLK eşleşen kuralı uygular: bu dosya 00_ ile başlar ki
# varsayılan kurallardan ÖNCE okunsun. Veritabanı İLK kez üretilmeden önce yazılmalıdır; var olan veritabanında etkili olması için `aide --update` ile yenilenmelidir.
- name: Make sure the AIDE config drop-in directory exists (audit tools)
  ansible.builtin.file:
    path: /etc/aide/aide.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardening_aide_audit_tools | bool and not (ansible_check_mode and hardening_aide_install is changed)

- name: Protect the audit tools with cryptographic checksums (CIS 6.3.3)
  ansible.builtin.copy:
    dest: /etc/aide/aide.conf.d/00_hardening_audit_tools
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible tarafından yönetilir (CIS 6.3.3): audit araçları özet + öznitelik denetimi.
      {% for t in hardening_aide_audit_tool_paths %}
      {{ t }} p+i+n+u+g+s+b+acl+xattrs+sha512
      {% endfor %}
  when: hardening_aide_audit_tools | bool and not (ansible_check_mode and hardening_aide_install is changed)

- name: Remove the audit tools AIDE rules (option off)
  ansible.builtin.file:
    path: /etc/aide/aide.conf.d/00_hardening_audit_tools
    state: absent
  when: not (hardening_aide_audit_tools | bool)

- name: Initialize AIDE database (ilk seferde dakikalar sürebilir)
  ansible.builtin.command: aideinit -y -f
  args:
    creates: /var/lib/aide/aide.db
  async: 1800
  poll: 15

- name: Make sure the daily AIDE check timer is enabled (CIS 6.3.2)
  ansible.builtin.systemd:
    name: dailyaidecheck.timer
    enabled: true
    state: started
  # --check ile temiz sunucuda paket kurulmaz, birim henüz yoktur (systemd "servis bulunamadı" derdi): o durumda atlanır.
  when: hardening_aide_scheduled_check | bool and not (ansible_check_mode and hardening_aide_install is changed)
