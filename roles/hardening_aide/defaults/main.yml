# Alan anahtarı. true (varsayılan): AIDE (dosya bütünlüğü) bu rolle uygulanır. false: rol (harden.yml'de) HİÇ çalışmaz; daha önce yazılmış dosya/ayar SİLİNMEZ ya da geri alınmaz.
hardening_aide_enabled: true
# true (varsayılan): aide-common'ın günlük kontrol zamanlayıcısı (dailyaidecheck.timer) açık ve başlatılmış olsun (CIS 6.3.2). Paket bunu zaten
# açık kurar, bu yüzden normalde değişiklik yapmaz (changed=0); biri kapattıysa geri açar. Zamanlayıcının yaptığı iş değişmez (COMMAND=update,
# veritabanı kendiliğinden güncellenmez). Sonuç /var/log/aide/ altındadır; e-posta teslim edilmez (docs/known-issues.md).
hardening_aide_scheduled_check: true
# Proxmox VE hostunda (hardening_platform=proxmox-host) AIDE'nin TARAMAYACAĞI yollar (`!yol`): pmxcfs, küme veritabanı, rrd, lxcfs, yerel depolama (VM/ISO/yedek), ceph.
# Yalnızca platform proxmox-host iken uygulanır. DENENMEDİ (gerçek AIDE koşusu Proxmox'ta yapılmadı).
hardening_aide_pve_excludes:
  - /etc/pve
  - /var/lib/pve-cluster
  - /var/lib/rrdcached
  - /var/lib/lxcfs
  - /var/lib/vz
  - /var/lib/ceph
# false (varsayılan): CIS 6.3.3 (Level 2). true iken audit araçları (hardening_aide_audit_tool_paths) AIDE'de özet (sha512) ve öznitelik (p+i+n+u+g+s+b+acl+xattrs) ile izlenir.
# AIDE veritabanı bu kuraldan ÖNCE üretildiyse `aide --update` gerekir; araçlar paketle güncellenince günlük kontrol "değişti" der (beklenen).
hardening_aide_audit_tools: false
hardening_aide_audit_tool_paths:
  - /usr/sbin/auditctl
  - /usr/sbin/auditd
  - /usr/sbin/ausearch
  - /usr/sbin/aureport
  - /usr/sbin/autrace
  - /usr/sbin/augenrules
