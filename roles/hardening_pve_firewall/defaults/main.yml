# Proxmox VE hostunda ufw yerine pve-firewall (datacenter cluster.fw). Tasarım: docs/design/proxmox-firewall.md
# Yönetim ağları hardening_ssh_allow_from'dan gelir (ufw rolüyle aynı değişken; tek sahibi hardening_ufw).
hardening_ssh_allow_from: []
# Ek açılacak portlar, yalnızca yönetim ağlarından: "443/tcp", "8000:8010/udp". Varsayılan boş: rpcbind (111) kapanır. Proxmox yönetim ağlarına 8006, 5900-5999 (VNC), 3128 (SPICE), 22 ve 60000-60050 (taşıma) portlarını KENDİSİ açar; bunlar için gerekmez.
hardening_pve_firewall_extra_ports: []
# Gerçek koşu kapısı: false iken playbooks/pve-firewall.yml yalnızca ne yapacağını GÖSTERİR, hiçbir şey yazmaz. true = güvenlik duvarını gerçekten yaz ve etkinleştir.
hardening_pve_apply: false
# Etkin yazma kapısı (iç): playbooks/pve-firewall.yml bunu hardening_pve_apply VEYA eylem onayından (hardening_pve_fw_confirm, yalnızca playbooks/pve-firewall-uygula.yml verir) türetir;
# playbooks/pve-firewall-onizleme.yml (hardening_pve_fw_preview_only=true) ikisini de geçersiz kılar: kapı kapalı.
# Rol tek başına çağrılırsa hardening_pve_apply'dan türer.
hardening_pve_fw_write: "{{ hardening_pve_apply | default(false) | bool }}"
# İç ayarlar (testlerde değiştirilir).
hardening_pve_firewall_file: /etc/pve/firewall/cluster.fw
hardening_pve_cluster_marker: /etc/pve/corosync.conf
hardening_pve_rollback_armed_file: /var/lib/hardening-rollback/armed
# Web arayüzü (8006) için AYRI kaynak listesi (örn. ters vekil/NPM IP'si). Varsayılan boş: 8006 yalnızca yönetim ağlarından (hardening_ssh_allow_from) açılır (değişmez).
# Dolu: bu ağlar yönetim ağlarına EK olarak 8006'ya erişir (`[IPSET web]`).
hardening_pve_web_allow_from: []
# false (varsayılan). true: 8006 YALNIZCA hardening_pve_web_allow_from'dan açılır, yönetim ağlarından kapanır (SSH, ping ve ek portlar yönetim ağlarında kalır). Liste boş ya da kontrol makinesi
# listede değilse hiçbir şey yazılmaz (erişim doğrulaması 8006'yı kontrol makinesinden dener).
hardening_pve_web_exclusive: false
