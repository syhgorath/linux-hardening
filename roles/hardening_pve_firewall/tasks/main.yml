# Proxmox VE (TEK düğüm) datacenter güvenlik duvarı. Karar mantığı files/pve_firewall_plan.py. Tasarım: docs/design/proxmox-firewall.md
# playbooks/pve-firewall.yml çağırır; harden.yml'e BAĞLI DEĞİL. Sıra: geri alma ağı arm -> bu rol -> hardening_verify_access (disarm).
# Okuma görevleri --check'te de çalışır; yazma yalnızca hardening_pve_apply=true ve --check değilken.
- name: Look for the cluster marker
  ansible.builtin.stat:
    path: "{{ hardening_pve_cluster_marker }}"
  register: hardening_pve_fw_cluster
  check_mode: false

- name: Look for the datacenter firewall file
  ansible.builtin.stat:
    path: "{{ hardening_pve_firewall_file }}"
  register: hardening_pve_fw_stat
  check_mode: false

- name: Read the datacenter firewall file
  ansible.builtin.slurp:
    src: "{{ hardening_pve_firewall_file }}"
  register: hardening_pve_fw_slurp
  when: hardening_pve_fw_stat.stat.exists
  check_mode: false

- name: Client address as the server sees it (SSH_CONNECTION, become olmadan)
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: hardening_pve_fw_conn
  changed_when: false
  failed_when: false
  check_mode: false

- name: Plan the Proxmox firewall
  ansible.builtin.script:
    cmd: "pve_firewall_plan.py {{ hardening_pve_fw_input | to_json | quote }}"
    executable: python3
  vars:
    hardening_pve_fw_input:
      clustered: "{{ hardening_pve_fw_cluster.stat.exists }}"
      allow_from: "{{ hardening_ssh_allow_from | default([]) }}"
      client_ip: "{{ (hardening_pve_fw_conn.stdout.split() | first | default('')) if hardening_pve_fw_conn.rc == 0 else '' }}"
      existing: "{{ (hardening_pve_fw_slurp.content | b64decode) if hardening_pve_fw_stat.stat.exists else none }}"
      extra_ports: "{{ hardening_pve_firewall_extra_ports | default([]) }}"
  register: hardening_pve_fw_raw
  changed_when: false
  check_mode: false

- name: Parse the Proxmox firewall plan
  ansible.builtin.set_fact:
    hardening_pve_fw_plan: "{{ hardening_pve_fw_raw.stdout | from_json }}"

- name: Stop because the Proxmox firewall cannot be managed safely
  ansible.builtin.fail:
    msg: "pve-firewall yönetilmedi, hiçbir şey yazılmadı: {{ hardening_pve_fw_plan.reasons | join(' ') }}{{ hardening_pve_fw_plan.error }}"
  when: hardening_pve_fw_plan.status == 'refuse'

- name: Say that the Proxmox firewall is already as wanted
  ansible.builtin.debug:
    msg: "pve-firewall: {{ hardening_pve_fw_plan.reasons | join(' ') }}"
  when: hardening_pve_fw_plan.status == 'noop'

- name: Show what would be written (hardening_pve_apply=false or --check)
  ansible.builtin.debug:
    msg: "pve-firewall ÖNİZLEME (yazılmadı), {{ hardening_pve_firewall_file }}:\n{{ hardening_pve_fw_plan.content }}"
  when: hardening_pve_fw_plan.status == 'apply' and (not (hardening_pve_apply | bool) or ansible_check_mode)

- name: Apply the Proxmox firewall
  when: hardening_pve_fw_plan.status == 'apply' and hardening_pve_apply | bool and not ansible_check_mode
  block:
    # noqa risky-file-permissions: pmxcfs chown/chmod desteklemez, sahip/izin bilerek verilmez.
    # unsafe_writes: pmxcfs (FUSE) atomik rename/chown/chmod desteklemeyebilir; dosya sahibi/izni verilmez.
    - name: Write the file DISABLED first (enable 0)
      ansible.builtin.copy:  # noqa: risky-file-permissions
        content: "{{ hardening_pve_fw_plan.content_disabled }}"
        dest: "{{ hardening_pve_firewall_file }}"
        unsafe_writes: true
      register: hardening_pve_fw_write_disabled

    # compile kuralları YALNIZCA üretip yazdırır, uygulamaz; sözdizimi hatası burada yakalanır.
    - name: Validate the rules without applying them (pve-firewall compile)
      ansible.builtin.command: pve-firewall compile
      register: hardening_pve_fw_compile
      changed_when: false

    - name: Write the file ENABLED (enable 1)
      ansible.builtin.copy:  # noqa: risky-file-permissions
        content: "{{ hardening_pve_fw_plan.content }}"
        dest: "{{ hardening_pve_firewall_file }}"
        unsafe_writes: true

    - name: Apply now (pve-firewall restart)
      ansible.builtin.systemd:
        name: pve-firewall
        state: restarted

    - name: Verify the firewall is enabled and running
      ansible.builtin.command: pve-firewall status
      register: hardening_pve_fw_status
      changed_when: false
      failed_when: "'enabled/running' not in hardening_pve_fw_status.stdout"

  rescue:
    # Yazma/doğrulama başarısız: dosyayı ÖNCEKİ haline döndür (yoksa sil) ve DUR. Zamanlı geri alma ağı ayrıca korur.
    - name: Restore the previous firewall file content
      ansible.builtin.copy:  # noqa: risky-file-permissions
        content: "{{ hardening_pve_fw_slurp.content | b64decode }}"
        dest: "{{ hardening_pve_firewall_file }}"
        unsafe_writes: true
      when: hardening_pve_fw_stat.stat.exists

    - name: Remove the firewall file that did not exist before
      ansible.builtin.file:
        path: "{{ hardening_pve_firewall_file }}"
        state: absent
      when: not hardening_pve_fw_stat.stat.exists

    - name: Stop because the Proxmox firewall could not be applied
      ansible.builtin.fail:
        msg: "pve-firewall uygulanamadı; cluster.fw önceki haline döndürüldü. Ayrıntı: {{ hardening_pve_fw_compile.stderr | default('') }}{{ hardening_pve_fw_status.stdout | default('') }}"
