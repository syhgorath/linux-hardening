# false (varsayılan, warn_if): true iken AppArmor profilleri ENFORCE kipine alınır (CIS 1.3 AppArmor; `aa-enforce /etc/apparmor.d/*`). Complain kipindeki profiller artık
# ihlalleri yalnızca kaydetmez, ENGELLER: servisler (Docker/LXC dahil) beklenmedik şekilde erişimini kaybedebilir. Kapatınca kip GERİ ALINMAZ (hangi profillerin complain olduğu tutulmaz).
# AppArmor çekirdekte etkin değilse (konteyner, bazı VM çekirdekleri) hiçbir şey yapılmaz ve söylenir. Profili olup korumasız (unconfined) süreçler yalnızca UYARI olur (yeniden başlatılana kadar korunmaz).
hardening_apparmor_enforce: false
