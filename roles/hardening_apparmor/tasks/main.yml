# AppArmor profillerini enforce kipine alır (varsayılan KAPALI). Karar yalnızca `aa-status --json` çıktısına dayanır: complain kipinde profil yoksa hiçbir şey çalışmaz (idempotent).
- name: AppArmor enforce mode (CIS 1.3)
  when: hardening_apparmor_enforce | bool
  block:
    - name: Install the AppArmor tools
      ansible.builtin.apt:
        name: [apparmor, apparmor-utils]
        state: present
      register: hardening_apparmor_install

    - name: Check whether AppArmor is enabled in the kernel (read-only)
      ansible.builtin.command: aa-status --enabled
      register: hardening_apparmor_active
      changed_when: false
      failed_when: false
      check_mode: false
      when: not (ansible_check_mode and hardening_apparmor_install is changed)

    - name: Say that AppArmor is not enabled
      ansible.builtin.debug:
        msg: "NOT (apparmor): AppArmor çekirdekte etkin değil (konteyner ya da AppArmor'suz çekirdek olabilir); profiller enforce edilmedi."
      when: hardening_apparmor_active.rc | default(1) != 0

    - name: Read the AppArmor profiles (read-only)
      ansible.builtin.command: aa-status --json
      register: hardening_apparmor_json
      changed_when: false
      failed_when: false
      check_mode: false
      when: hardening_apparmor_active.rc | default(1) == 0

    - name: Work out the profiles in complain mode and the unconfined processes
      ansible.builtin.set_fact:
        hardening_apparmor_complain: >-
          {{ (hardening_apparmor_json.stdout | from_json).profiles | default({}) | dict2items | selectattr('value', 'equalto', 'complain') | map(attribute='key') | list }}
        hardening_apparmor_unconfined: >-
          {{ (hardening_apparmor_json.stdout | from_json).processes | default({}) | dict2items
             | map(attribute='value') | flatten | selectattr('status', 'defined') | selectattr('status', 'search', 'unconfined') | list | length }}
      when: hardening_apparmor_active.rc | default(1) == 0 and hardening_apparmor_json.rc == 0 and hardening_apparmor_json.stdout | length > 0

    - name: Put the complain-mode profiles in enforce mode
      ansible.builtin.shell:
        cmd: aa-enforce /etc/apparmor.d/*
        executable: /bin/bash
      register: hardening_apparmor_enforced
      changed_when: true
      failed_when: false
      when:
        - not ansible_check_mode
        - hardening_apparmor_complain | default([]) | length > 0

    - name: Read the AppArmor profiles again (read-only)
      ansible.builtin.command: aa-status --json
      register: hardening_apparmor_json_after
      changed_when: false
      failed_when: false
      check_mode: false
      when: hardening_apparmor_enforced is not skipped

    - name: Warn about profiles still in complain mode
      ansible.builtin.debug:
        msg: >-
          UYARI (apparmor): {{ (hardening_apparmor_json_after.stdout | from_json).profiles | dict2items | selectattr('value', 'equalto', 'complain') | map(attribute='key') | list | length }}
          profil hâlâ complain kipinde (aa-enforce çıkışı: {{ hardening_apparmor_enforced.stdout_lines[-3:] | join(' | ') }}).
      when:
        - hardening_apparmor_json_after is not skipped
        - hardening_apparmor_json_after.rc | default(1) == 0
        - (hardening_apparmor_json_after.stdout | from_json).profiles | dict2items | selectattr('value', 'equalto', 'complain') | list | length > 0

    - name: Warn about unconfined processes that have a profile
      ansible.builtin.debug:
        msg: >-
          UYARI (apparmor): profili olup korumasız (unconfined) çalışan {{ hardening_apparmor_unconfined }} süreç var; ilgili servisleri yeniden başlatın (profil yalnızca süreç başlarken uygulanır).
      when: hardening_apparmor_unconfined | default(0) | int > 0
