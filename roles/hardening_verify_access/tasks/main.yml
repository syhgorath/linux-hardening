# ufw/ssh değişikliğinden SONRA: kontrol makinesinden YENİ ve bağımsız bir SSH bağlantısı açar.
# Başarılıysa geri alma güvenlik ağını DISARM eder (hardening_rollback).
# Başarısızsa, hardening_rollback kuruluysa ÖNCEKİ duruma döner (yedekten geri yükler, silmez); kurulu değilse
# (hardening_rollback_enabled=false) eski davranış: sshd drop-in'i siler, ufw'yi kapatır. Sonra durur.
# Sınırlar docs/decisions.md ve HOWTO.md'de yazılıdır (başka rollerin değişiklikleri geri ALINMAZ).
# --check modunda hiçbir şey değişmediği için atlanır.
- name: Verify access after ssh/ufw changes
  when: not ansible_check_mode
  block:
    - name: Flush pending handlers (sshd reload burada uygulanır)
      ansible.builtin.meta: flush_handlers

    - name: Login user (become olmadan)
      ansible.builtin.command: id -un
      become: false
      register: hardening_verify_access_user
      changed_when: false

    # keyboard-interactive (2FA) açıkken BatchMode ile tam kimlik doğrulama yapılamaz (istem cevaplanamaz) ve
    # yanlışlıkla geri alma tetiklenirdi. O durumda yalnızca yeni bir TCP bağlantısında SSH banner'ı beklenir
    # (sshd ayakta ve firewall izin veriyor); kimlik doğrulama doğrulanmaz.
    - name: Verify a NEW TCP connection shows the SSH banner (kbd-interactive açık)
      delegate_to: localhost
      become: false
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}"
        port: "{{ hostvars[inventory_hostname]['ansible_port'] | default(22) }}"
        search_regex: "SSH-2.0"
        connect_timeout: 8
        timeout: 20
      when: hardening_ssh_kbdinteractive | default(false)

    - name: Open a NEW SSH connection from the controller (BatchMode, çoklama yok)
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: >-
          {{ ['ssh', '-o', 'BatchMode=yes', '-o', 'ControlMaster=no', '-o', 'ControlPath=none',
              '-o', 'ConnectTimeout=8', '-o', 'PreferredAuthentications=publickey']
             + (['-p', (hostvars[inventory_hostname]['ansible_port'] | string)]
                if hostvars[inventory_hostname]['ansible_port'] is defined else [])
             + (['-i', hostvars[inventory_hostname]['ansible_ssh_private_key_file'], '-o', 'IdentitiesOnly=yes']
                if hostvars[inventory_hostname]['ansible_ssh_private_key_file'] is defined else [])
             + (hostvars[inventory_hostname]['ansible_ssh_common_args'].split()
                if hostvars[inventory_hostname]['ansible_ssh_common_args'] is defined else [])
             + [(hostvars[inventory_hostname]['ansible_user'] | default(hardening_verify_access_user.stdout))
                ~ '@' ~ (hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname)),
                'true'] }}
      register: hardening_verify_access_new_connection
      changed_when: false
      retries: 2
      delay: 3
      until: hardening_verify_access_new_connection.rc == 0
      when: not (hardening_ssh_kbdinteractive | default(false))

    # Ek TCP portları (ör. Proxmox web arayüzü 8006): kontrol makinesinden YENİ bağlantı kurulabilmeli. Varsayılan boş = atlanır.
    - name: Verify extra TCP ports from the controller
      delegate_to: localhost
      become: false
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}"
        port: "{{ item }}"
        connect_timeout: 8
        timeout: 20
      loop: "{{ hardening_verify_access_tcp_ports | default([]) }}"

    - name: Disarm rollback safety net (erişim doğrulandı)
      ansible.builtin.include_role:
        name: hardening_rollback
        tasks_from: disarm

  rescue:
    - name: Check rollback script is installed
      ansible.builtin.stat:
        path: /usr/local/sbin/hardening-rollback
      register: hardening_verify_access_rollback_script

    - name: ROLLBACK - restore previous state (hardening_rollback)
      ansible.builtin.include_role:
        name: hardening_rollback
        tasks_from: restore
      when:
        - hardening_rollback_enabled | default(true) | bool
        - hardening_verify_access_rollback_script.stat.exists

    # Güvenlik ağı kurulu değilse (kapalı ya da kurulamadı): eski, sil/kapat davranışı
    - name: ROLLBACK (eski davranış) - remove sshd drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
        state: absent
      when: not (hardening_rollback_enabled | default(true) | bool and hardening_verify_access_rollback_script.stat.exists)

    - name: ROLLBACK (eski davranış) - reload sshd
      ansible.builtin.systemd:
        name: "{{ hardening_ssh_service | default('ssh') }}"
        state: reloaded
      when: not (hardening_rollback_enabled | default(true) | bool and hardening_verify_access_rollback_script.stat.exists)

    - name: ROLLBACK (eski davranış) - disable ufw (kurallar silinmez, sadece firewall kapatılır)
      ansible.builtin.command: ufw --force disable
      changed_when: true
      failed_when: false
      when: not (hardening_rollback_enabled | default(true) | bool and hardening_verify_access_rollback_script.stat.exists)

    - name: Stop with a clear message (önceki duruma dönüldü)
      ansible.builtin.fail:
        msg: >-
          Yeni SSH bağlantısı doğrulanamadı; ÖNCEKİ DURUMA DÖNÜLDÜ: sshd drop-in, ufw (kurallar ve aktif/pasif
          durumu) ve Proxmox cluster.fw değişiklikten önceki yedekten geri yüklendi. GERİ ALINMADI: kurulan paketler, sysctl, auditd,
          fail2ban, AIDE ve diğer roller. Erişimi elle doğrulayın; gerekirse Proxmox konsolu/snapshot kullanın.
      when: hardening_rollback_enabled | default(true) | bool and hardening_verify_access_rollback_script.stat.exists

    - name: Stop with a clear message (eski davranış)
      ansible.builtin.fail:
        msg: >-
          Yeni SSH bağlantısı doğrulanamadı; GERİ ALINDI: /etc/ssh/sshd_config.d/00-hardening.conf silindi,
          sshd yeniden yüklendi, ufw kapatıldı (geri alma güvenlik ağı kurulu değildi). GERİ ALINMADI: kurulan
          paketler, sysctl, auditd, fail2ban, AIDE ve diğer roller. Erişimi elle doğrulayın; gerekirse Proxmox
          konsolu/snapshot kullanın.
      when: not (hardening_rollback_enabled | default(true) | bool and hardening_verify_access_rollback_script.stat.exists)
