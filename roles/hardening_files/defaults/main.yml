# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# false: rol hiçbir şey yapmaz (kaçış anahtarı).
hardening_files_enabled: true
# Yalnızca TEST için (test/test_files_role.py): yollara önek, dinamik listelerde (sshd drop-in, ana bilgisayar anahtarları) sahip/grup. Gerçek kullanımda dokunmayın.
hardening_files_root: ""
hardening_files_owner: root
hardening_files_group: root

# Yalnızca MEVCUT dosya/dizinlere dokunulur (yoksa atlanır, oluşturulmaz). Modlar CIS düzeltmeleri gibi SEMBOLİKTİR ve yalnızca fazla izni KALDIRIR:
# zaten daha kısıtlı bir dosya gevşetilmez (örn. 0600 olan /etc/passwd 0644 olmaz). group_ok: listedeki mevcut grup korunur, değilse group atanır.
hardening_files_targets:
  # CIS 7.1.1-7.1.4, 7.1.9
  - { path: /etc/passwd, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/passwd-, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/group, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/group-, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/shells, mode: "u-x,go-wx", owner: root, group: root }
  # CIS 7.1.5-7.1.8: root:shadow (Ubuntu varsayılanı) ya da root:root kabul
  - { path: /etc/shadow, mode: "u-x,g-wx,o-rwx", owner: root, group: shadow, group_ok: [root, shadow] }
  - { path: /etc/shadow-, mode: "u-x,g-wx,o-rwx", owner: root, group: shadow, group_ok: [root, shadow] }
  - { path: /etc/gshadow, mode: "u-x,g-wx,o-rwx", owner: root, group: shadow, group_ok: [root, shadow] }
  - { path: /etc/gshadow-, mode: "u-x,g-wx,o-rwx", owner: root, group: shadow, group_ok: [root, shadow] }
  # CIS 7.1.10
  - { path: /etc/security/opasswd, mode: "u-x,go-rwx", owner: root, group: root }
  - { path: /etc/security/opasswd.old, mode: "u-x,go-rwx", owner: root, group: root }
  # CIS 5.1.1, 5.1.2 (dizin: group/other hiçbir şey)
  - { path: /etc/ssh/sshd_config, mode: "u-x,og-rwx", owner: root, group: root }
  - { path: /etc/ssh/sshd_config.d, mode: "go-rwx", owner: root, group: root }
  # CIS 2.4.1 alt maddeleri: crontab ve cron dizinleri (cron kurulu değilse yoklar atlanır)
  - { path: /etc/crontab, mode: "og-rwx", owner: root, group: root }
  - { path: /etc/cron.hourly, mode: "og-rwx", owner: root, group: root }
  - { path: /etc/cron.daily, mode: "og-rwx", owner: root, group: root }
  - { path: /etc/cron.weekly, mode: "og-rwx", owner: root, group: root }
  - { path: /etc/cron.monthly, mode: "og-rwx", owner: root, group: root }
  - { path: /etc/cron.yearly, mode: "og-rwx", owner: root, group: root }
  - { path: /etc/cron.d, mode: "og-rwx", owner: root, group: root }
  # CIS 2.4.1 ve 2.4.2 (cron.allow, at.allow): yalnızca VARSA izinler sıkılaştırılır; dosya OLUŞTURULMAZ (boş cron.allow crontab kullanımını kapatırdı)
  - { path: /etc/cron.allow, mode: "u-x,g-wx,o-rwx", owner: root, group: root, group_ok: [root, crontab] }
  - { path: /etc/at.allow, mode: "u-x,g-wx,o-rwx", owner: root, group: root, group_ok: [root, daemon] }
  # CIS 1.2.1: APT dizinleri 0755 ya da daha kısıtlı (yalnız yazma izni kaldırılır; dosya izinleri aşağıdaki görevlerde)
  - { path: /etc/apt/auth.conf.d, mode: "go-w", owner: root, group: root }
  - { path: /etc/apt/sources.list.d, mode: "go-w", owner: root, group: root }
  # Docker (CIS Docker 3.x): yalnızca VARSA uygulanır (Docker kurulu değilse yollar yoktur)
  - { path: /usr/lib/systemd/system/docker.service, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/systemd/system/docker.service, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /usr/lib/systemd/system/docker.socket, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/systemd/system/docker.socket, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/docker, mode: "go-w", owner: root, group: root }
  - { path: /etc/docker/daemon.json, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /etc/default/docker, mode: "u-x,go-wx", owner: root, group: root }
  - { path: /run/docker.sock, mode: "u-x,g-x,o-rwx", owner: root, group: docker, group_ok: [root, docker] }
  - { path: /run/containerd/containerd.sock, mode: "u-x,g-x,o-rwx", owner: root, group: root }
  # /etc/sudoers.d dizini: grup yazma ve diğer erişim yok (0750; klasik sudo'nun Debian varsayılanı; sudo-rs 0755 bırakıyor). Lynis AUTH-9252 0755'i "possibly unsafe" sayar.
  # sudo kök olarak okur; sudoers.d içindeki dosyalar zaten 0440.
  - { path: /etc/sudoers.d, mode: "g-w,o-rwx", owner: root, group: root }
  # CIS 1.6.6, 1.6.9
  - { path: /etc/motd, mode: "u-x,go-wx", owner: root, group: root }
  # CIS 1.4.2 (update-grub dosyayı yeniden yazarsa 0444'e dönebilir; bir sonraki çalıştırmada yeniden sıkılaştırılır)
  - { path: /boot/grub/grub.cfg, mode: "u-x,go-rwx", owner: root, group: root }
# true: /var/log altındaki dosyalarda grup yazma ve diğer erişimi kaldırır (CIS günlük dosyası erişimi). wtmp/btmp/lastlog/faillog ve journal dosyalarına dokunulmaz.
# Bedeli: `adm` grubunda olmayan okuyucular (izleme/günlük toplayıcı ajanları) bazı günlükleri okuyamaz. Varsayılan kapalı.
hardening_log_file_permissions: false
# true (varsayılan): /tmp ve /dev/shm bağlama seçenekleri SALT OKUNUR raporu (CIS 1.1.2: ayrı bağlama, nodev, nosuid, noexec). Hiçbir şeyi DEĞİŞTİRMEZ; noexec yoksa yalnızca not düşer
# (Ubuntu varsayılanı budur), nodev/nosuid yoksa, ayrı bağlama değilse ya da Ansible remote_tmp /tmp altındaysa uyarır. `--check`'te de çalışır.
hardening_tmp_report: true
# true: /tmp'ye `nodev,nosuid,noexec` uygulanır (CIS 1.1.2; tmp.mount drop-in'i + anında remount). Bu dizinden doğrudan ÇALIŞTIRMA kapanır: /tmp'ten ikili çalıştıran uygulamalar
# (PHP/Java/Node işleri, bazı paket betikleri ve derleme araçları) bozulabilir; sorun olursa bunu false yapın. Ansible etkilenmez (~/.ansible/tmp kullanır). Yalnızca AYRI ve tmpfs olan /tmp yönetilir.
hardening_tmp_noexec: true
# true: /dev/shm'ye `nodev,nosuid,noexec` uygulanır (/etc/fstab satırı + anında remount; satır zaten varsa üstüne yazılmaz). Sorun olursa false yapın.
hardening_shm_noexec: true

# false (varsayılan, warn_if): true iken derleyici/assembler ikili dosyalarında "diğer" erişimi kaldırılır (o-rwx; Lynis HRDN-7222). Yalnızca root ve grup üyeleri derleyebilir.
# Sembolik bağlar çözülür (gerçek dosyanın izni değişir). Bedeli: root olmayan kullanıcılar derleme yapamaz (pip/npm yerel eklentileri, make, CI/yapı işleri bozulabilir).
# Kapatınca izinler GERİ ALINMAZ (eski izin tutulmaz). Yalnızca VAR olan yollara dokunulur.
hardening_restrict_compilers: false
hardening_restrict_compilers_paths:
  - /usr/bin/as
  - /usr/bin/cc
  - /usr/bin/c++
  - /usr/bin/gcc
  - /usr/bin/g++
  - /usr/bin/clang
  - /usr/bin/clang++
