# Derleyiciler (Lynis HRDN-7222; hardening_restrict_compilers, varsayılan KAPALI): "diğer" erişimi kaldırılır. Sembolik bağlar çözülür (follow). Yalnızca var olan yollar.
- name: Restrict compilers to root and its group (Lynis HRDN-7222)
  when: hardening_restrict_compilers | bool
  block:
    - name: Stat the compiler binaries
      ansible.builtin.stat:
        path: "{{ hardening_files_root }}{{ item }}"
        follow: true
      loop: "{{ hardening_restrict_compilers_paths }}"
      register: hardening_files_compiler_stat

    - name: Remove other access from the compiler binaries
      ansible.builtin.file:
        path: "{{ hardening_files_root }}{{ item.item }}"
        mode: "o-rwx"
        follow: true
      loop: "{{ hardening_files_compiler_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists and item.stat.isreg

# Dosya izinleri (CIS 7.1.x, 5.1.1-5.1.4, 2.4.x, 1.4.2, 1.6.6). Yalnızca fazla izni kaldırır (sembolik modlar), mevcut dosyalara dokunur, yenisini oluşturmaz.
# Geri alma güvenlik ağı bunları geri almaz (izinler yalnızca sıkılaşır). Kapsam: docs/cis-esleme.md.
- name: File permissions (CIS)
  when: hardening_files_enabled | bool
  block:
    - name: Stat the static targets
      ansible.builtin.stat:
        path: "{{ hardening_files_root }}{{ item.path }}"
      loop: "{{ hardening_files_targets }}"
      loop_control:
        label: "{{ item.path }}"
      register: hardening_files_stat

    - name: Tighten ownership and mode (only existing paths)
      ansible.builtin.file:
        path: "{{ hardening_files_root }}{{ item.item.path }}"
        state: "{{ 'directory' if item.stat.isdir else 'file' }}"
        owner: "{{ item.item.owner }}"
        group: "{{ item.stat.gr_name if item.stat.gr_name in (item.item.group_ok | default([])) else item.item.group }}"
        mode: "{{ item.item.mode }}"
        follow: false
      loop: "{{ hardening_files_stat.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.stat.exists and not item.stat.islnk

    # Dinamik listeler (adları sabit değil). `find` salt okunurdur, `--check`'te de çalışır.
    - name: Find sshd drop-in files
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/ssh/sshd_config.d"
        patterns: "*.conf"
        file_type: file
      register: hardening_files_sshd_dropins

    - name: Tighten sshd drop-in files (CIS 5.1.1)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,og-rwx"
      loop: "{{ hardening_files_sshd_dropins.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find SSH private host keys
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/ssh"
        patterns: "ssh_host_*_key"
        file_type: file
      register: hardening_files_hostkeys

    - name: Tighten SSH private host keys (CIS 5.1.3)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-rwx"
      loop: "{{ hardening_files_hostkeys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find SSH public host keys
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/ssh"
        patterns: "ssh_host_*_key.pub"
        file_type: file
      register: hardening_files_hostkeys_pub

    - name: Tighten SSH public host keys (CIS 5.1.4)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-wx"
      loop: "{{ hardening_files_hostkeys_pub.files }}"
      loop_control:
        label: "{{ item.path }}"

    # CIS 1.2.1 (auth.conf.d): /etc/apt/auth.conf.d/*.conf (özel depo/vekil kimlik bilgileri) root:root ve 0640 ya da daha kısıtlı (dizin varsayılan olarak boştur)
    - name: Find APT auth.conf.d files
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/apt/auth.conf.d"
        patterns: "*.conf"
        file_type: file
      register: hardening_files_apt_auth

    - name: Tighten APT auth.conf.d files (CIS 1.2.1)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,g-wx,o-rwx"
      loop: "{{ hardening_files_apt_auth.files }}"
      loop_control:
        label: "{{ item.path }}"

    # CIS 1.6.9: pam_motd'nin gösterdiği dosya(lar) (/etc/pam.d içindeki `motd=` bağımsız değişkeni, Ubuntu'da /run/motd.dynamic) root:root ve 0644 ya da daha kısıtlı.
    # Dosya girişte oluşur; yoksa atlanır. Salt okunur okuma (`--check`'te de çalışır).
    - name: Find the pam_motd files
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          sed -n 's/^[^#]*motd=\([^[:space:]]*\).*/\1/p' {{ hardening_files_root }}/etc/pam.d/* 2>/dev/null | sort -u || true
        executable: /bin/bash
      register: hardening_files_pam_motd
      changed_when: false
      check_mode: false

    - name: Stat the pam_motd files
      ansible.builtin.stat:
        path: "{{ hardening_files_root }}{{ item }}"
      loop: "{{ hardening_files_pam_motd.stdout_lines | select('match', '^/[A-Za-z0-9_./-]+$') | list }}"
      register: hardening_files_pam_motd_stat

    - name: Tighten the pam_motd files (CIS 1.6.9)
      ansible.builtin.file:
        path: "{{ hardening_files_root }}{{ item.item }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-wx"
        follow: false
      loop: "{{ hardening_files_pam_motd_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists and item.stat.isreg | default(false)

    # CIS 1.2.1: APT anahtar (.gpg) ve kaynak dosyaları 0644 ya da daha kısıtlı, root:root
    - name: Find APT key files
      ansible.builtin.find:
        paths:
          - "{{ hardening_files_root }}/usr/share/keyrings"
          - "{{ hardening_files_root }}/etc/apt/trusted.gpg.d"
        patterns: "*gpg"
        file_type: file
      register: hardening_files_apt_keys

    - name: Tighten APT key files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-wx"
      loop: "{{ hardening_files_apt_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find APT source files
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/apt/sources.list.d"
        patterns: "*"
        file_type: file
      register: hardening_files_apt_sources

    - name: Tighten APT source files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-wx"
      loop: "{{ hardening_files_apt_sources.files }}"
      loop_control:
        label: "{{ item.path }}"

# --- Günlük dosyası izinleri (varsayılan KAPALI): yalnızca fazla izni kaldırır ---
- name: Log file permissions (CIS)
  when: hardening_files_enabled | bool and hardening_log_file_permissions | bool
  block:
    - name: List log files with excess permissions (read-only)
      ansible.builtin.command:
        argv:
          - find
          - "{{ hardening_files_root }}/var/log"
          - -type
          - f
          # "-perm /0027" GNU'ya özgüdür; taşınabilir karşılığı: g+w, g+x ya da diğer herhangi bir izin biti varsa
          - "("
          - -perm
          - "-0020"
          - -o
          - -perm
          - "-0010"
          - -o
          - -perm
          - "-0004"
          - -o
          - -perm
          - "-0002"
          - -o
          - -perm
          - "-0001"
          - ")"
          - "!"
          - -path
          - "*/journal/*"
          - "!"
          - -name
          - "wtmp*"
          - "!"
          - -name
          - "btmp*"
          - "!"
          - -name
          - "lastlog*"
          - "!"
          - -name
          - "faillog*"
          - -print
      register: hardening_files_logs
      changed_when: false
      check_mode: false

    - name: Tighten log file permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        mode: "g-wx,o-rwx"
        follow: false
      loop: "{{ hardening_files_logs.stdout_lines }}"

# --- /tmp ve /dev/shm için nodev,nosuid,noexec (CIS 1.1.2). Davranışı DEĞİŞTİRİR: bu dizinlerden doğrudan çalıştırma kapanır (paket betikleri, derleme araçları, /tmp'ten ikili çalıştıran uygulamalar;
# Ansible kendisi ~/.ansible/tmp kullanır, etkilenmez). Karar mantığı files/tmp_plan.py: yalnızca AYRI ve tmpfs olan dizin yönetilir; /tmp kalıcılığı tmp.mount drop-in'i, /dev/shm kalıcılığı /etc/fstab satırı
# (satır zaten varsa ÜSTÜNE YAZILMAZ). Etki anında `mount -o remount` ile uygulanır. Kapatmak için hardening_tmp_noexec / hardening_shm_noexec = false. Tasarım: docs/design/grup3-tmp-su-root.md ---
- name: Harden the /tmp and /dev/shm mount options
  when: (hardening_tmp_noexec | bool or hardening_shm_noexec | bool) and not (hardening_platform_relaxed | default(false) | bool)
  block:
    - name: Read the mounts behind /tmp and /dev/shm for the plan
      ansible.builtin.shell:
        cmd: |
          for t in /tmp /dev/shm; do
            echo "$t: $(findmnt -n -o TARGET,FSTYPE,OPTIONS --target "$t" 2>/dev/null)"
          done
        executable: /bin/sh
      register: hardening_tmpm_mounts
      changed_when: false
      failed_when: false
      check_mode: false

    # state/enabled verilmez: ansible.builtin.systemd yalnızca durumu OKUR (status.ActiveState).
    - name: Read whether tmp.mount manages /tmp
      ansible.builtin.systemd:
        name: tmp.mount
      register: hardening_tmpm_unit
      failed_when: false
      check_mode: false

    - name: Read the /dev/shm line of /etc/fstab
      ansible.builtin.shell:
        cmd: awk '$2 == "/dev/shm" && $1 !~ /^#/ {print; exit}' /etc/fstab
        executable: /bin/sh
      register: hardening_tmpm_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Plan the mount option changes
      ansible.builtin.script:
        cmd: >-
          tmp_plan.py {{ {'mounts': hardening_tmpm_mounts.stdout_lines | default([]),
          'tmp_mount_active': (hardening_tmpm_unit.status | default({})).ActiveState | default(''),
          'shm_fstab': hardening_tmpm_fstab.stdout | default('') | trim,
          'want_tmp': hardening_tmp_noexec | bool,
          'want_shm': hardening_shm_noexec | bool} | to_json | quote }}
        executable: python3
      register: hardening_tmpm_raw
      changed_when: false
      check_mode: false

    - name: Parse the mount plan
      ansible.builtin.set_fact:
        hardening_tmpm_plan: "{{ hardening_tmpm_raw.stdout | from_json }}"

    - name: Warn about mounts that cannot be managed
      ansible.builtin.debug:
        msg: "UYARI (tmp): {{ hardening_tmpm_plan.warnings | join(' ') }} Bu dizin için noexec/nosuid/nodev uygulanmadı."
      when: hardening_tmpm_plan.warnings | length > 0

    - name: Create the tmp.mount drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/tmp.mount.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: hardening_tmpm_plan.tmp.persist

    - name: Make /tmp nodev,nosuid,noexec persistent (tmp.mount drop-in)
      ansible.builtin.copy:
        dest: /etc/systemd/system/tmp.mount.d/50-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Ansible tarafından yönetilir (hardening_tmp_noexec). Kaldırmak için hardening_tmp_noexec=false yapın ve bu dosyayı silin.
          [Mount]
          Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%,nr_inodes=1m
      when: hardening_tmpm_plan.tmp.persist
      register: hardening_tmpm_dropin

    - name: Reload systemd after the tmp.mount drop-in changed
      ansible.builtin.systemd:
        daemon_reload: true
      when: hardening_tmpm_dropin is changed and not ansible_check_mode

    - name: Apply nodev,nosuid,noexec to /tmp now
      ansible.builtin.command: mount -o remount,nodev,nosuid,noexec /tmp  # noqa: command-instead-of-module (ansible.posix kurulu değil)
      changed_when: true
      when: hardening_tmpm_plan.tmp.remount and not ansible_check_mode

    - name: Make /dev/shm nodev,nosuid,noexec persistent (/etc/fstab)
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*tmpfs\s+/dev/shm\s'
        line: "tmpfs /dev/shm tmpfs defaults,nodev,nosuid,noexec 0 0"
        insertafter: EOF
      when: hardening_tmpm_plan.shm.persist

    - name: Apply nodev,nosuid,noexec to /dev/shm now
      ansible.builtin.command: mount -o remount,nodev,nosuid,noexec /dev/shm  # noqa: command-instead-of-module (ansible.posix kurulu değil)
      changed_when: true
      when: hardening_tmpm_plan.shm.remount and not ansible_check_mode

# --- /tmp ve /dev/shm bağlama seçenekleri raporu (CIS 1.1.2: ayrı bağlama, nodev, nosuid, noexec). SALT OKUNUR: hiçbir şeyi değiştirmez, `--check`'te de çalışır.
# Karar mantığı files/tmp_report.py. noexec davranışı değiştirdiği için (paket betikleri, Ansible remote_tmp) yalnızca raporlanır; tasarım: docs/design/grup3-tmp-su-root.md ---
- name: Temporary directory mount report (read-only)
  when: hardening_tmp_report | bool
  block:
    - name: Read the mounts behind /tmp and /dev/shm
      ansible.builtin.shell:
        cmd: |
          for t in /tmp /dev/shm; do
            echo "$t: $(findmnt -n -o TARGET,FSTYPE,OPTIONS --target "$t" 2>/dev/null)"
          done
        executable: /bin/sh
      register: hardening_tmp_mounts
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Evaluate the temporary directory mounts
      ansible.builtin.script:
        cmd: >-
          tmp_report.py {{ {'mounts': hardening_tmp_mounts.stdout_lines | default([]),
          'remote_tmp': ansible_remote_tmp | default('')} | to_json | quote }}
        executable: python3
      register: hardening_tmp_raw
      changed_when: false
      check_mode: false

    - name: Parse the temporary directory report
      ansible.builtin.set_fact:
        hardening_tmp_result: "{{ hardening_tmp_raw.stdout | from_json }}"

    - name: Warn about temporary directory mount problems
      ansible.builtin.debug:
        msg: "UYARI (tmp, CIS 1.1.2): {{ hardening_tmp_result.warnings | join(' ') }} Hiçbir şey değiştirilmedi."
      when: hardening_tmp_result.status == 'warn'

    - name: Show the temporary directory report
      ansible.builtin.debug:
        msg: "NOT (tmp): {{ (hardening_tmp_result.summary ~ ' ' ~ (hardening_tmp_result.notes | join(' '))) | trim }}"
      when: hardening_tmp_result.status != 'unknown' and (hardening_tmp_result.notes | length > 0 or hardening_tmp_result.summary | length > 0)

    - name: Note that the temporary directory report could not be evaluated
      ansible.builtin.debug:
        msg: "UYARI (tmp): rapor değerlendirilemedi: {{ hardening_tmp_result.error }}"
      when: hardening_tmp_result.status == 'unknown'
