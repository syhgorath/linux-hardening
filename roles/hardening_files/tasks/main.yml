# Dosya izinleri (CIS 7.1.x, 5.1.1-5.1.4, 2.4.x, 1.4.2, 1.6.6). Yalnızca fazla izni kaldırır (sembolik modlar), mevcut dosyalara dokunur, yenisini oluşturmaz.
# Geri alma güvenlik ağı bunları geri almaz (izinler yalnızca sıkılaşır). Kapsam: docs/cis-esleme.md.
- name: File permissions (CIS)
  when: hardening_files_enabled | bool
  block:
    - name: Stat the static targets
      ansible.builtin.stat:
        path: "{{ hardening_files_root }}{{ item.path }}"
      loop: "{{ hardening_files_targets }}"
      loop_control:
        label: "{{ item.path }}"
      register: hardening_files_stat

    - name: Tighten ownership and mode (only existing paths)
      ansible.builtin.file:
        path: "{{ hardening_files_root }}{{ item.item.path }}"
        state: "{{ 'directory' if item.stat.isdir else 'file' }}"
        owner: "{{ item.item.owner }}"
        group: "{{ item.stat.gr_name if item.stat.gr_name in (item.item.group_ok | default([])) else item.item.group }}"
        mode: "{{ item.item.mode }}"
        follow: false
      loop: "{{ hardening_files_stat.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.stat.exists and not item.stat.islnk

    # Dinamik listeler (adları sabit değil). `find` salt okunurdur, `--check`'te de çalışır.
    - name: Find sshd drop-in files
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/ssh/sshd_config.d"
        patterns: "*.conf"
        file_type: file
      register: hardening_files_sshd_dropins

    - name: Tighten sshd drop-in files (CIS 5.1.1)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,og-rwx"
      loop: "{{ hardening_files_sshd_dropins.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find SSH private host keys
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/ssh"
        patterns: "ssh_host_*_key"
        file_type: file
      register: hardening_files_hostkeys

    - name: Tighten SSH private host keys (CIS 5.1.3)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-rwx"
      loop: "{{ hardening_files_hostkeys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find SSH public host keys
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/ssh"
        patterns: "ssh_host_*_key.pub"
        file_type: file
      register: hardening_files_hostkeys_pub

    - name: Tighten SSH public host keys (CIS 5.1.4)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-wx"
      loop: "{{ hardening_files_hostkeys_pub.files }}"
      loop_control:
        label: "{{ item.path }}"

    # CIS 1.2.1: APT anahtar (.gpg) ve kaynak dosyaları 0644 ya da daha kısıtlı, root:root
    - name: Find APT key files
      ansible.builtin.find:
        paths:
          - "{{ hardening_files_root }}/usr/share/keyrings"
          - "{{ hardening_files_root }}/etc/apt/trusted.gpg.d"
        patterns: "*gpg"
        file_type: file
      register: hardening_files_apt_keys

    - name: Tighten APT key files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-wx"
      loop: "{{ hardening_files_apt_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find APT source files
      ansible.builtin.find:
        paths: "{{ hardening_files_root }}/etc/apt/sources.list.d"
        patterns: "*"
        file_type: file
      register: hardening_files_apt_sources

    - name: Tighten APT source files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: "{{ hardening_files_owner }}"
        group: "{{ hardening_files_group }}"
        mode: "u-x,go-wx"
      loop: "{{ hardening_files_apt_sources.files }}"
      loop_control:
        label: "{{ item.path }}"

# --- Günlük dosyası izinleri (varsayılan KAPALI): yalnızca fazla izni kaldırır ---
- name: Log file permissions (CIS)
  when: hardening_files_enabled | bool and hardening_log_file_permissions | bool
  block:
    - name: List log files with excess permissions (read-only)
      ansible.builtin.command:
        argv:
          - find
          - "{{ hardening_files_root }}/var/log"
          - -type
          - f
          # "-perm /0027" GNU'ya özgüdür; taşınabilir karşılığı: g+w, g+x ya da diğer herhangi bir izin biti varsa
          - "("
          - -perm
          - "-0020"
          - -o
          - -perm
          - "-0010"
          - -o
          - -perm
          - "-0004"
          - -o
          - -perm
          - "-0002"
          - -o
          - -perm
          - "-0001"
          - ")"
          - "!"
          - -path
          - "*/journal/*"
          - "!"
          - -name
          - "wtmp*"
          - "!"
          - -name
          - "btmp*"
          - "!"
          - -name
          - "lastlog*"
          - "!"
          - -name
          - "faillog*"
          - -print
      register: hardening_files_logs
      changed_when: false
      check_mode: false

    - name: Tighten log file permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        mode: "g-wx,o-rwx"
        follow: false
      loop: "{{ hardening_files_logs.stdout_lines }}"

# --- /tmp ve /dev/shm bağlama seçenekleri raporu (CIS 1.1.2: ayrı bağlama, nodev, nosuid, noexec). SALT OKUNUR: hiçbir şeyi değiştirmez, `--check`'te de çalışır.
# Karar mantığı files/tmp_report.py. noexec davranışı değiştirdiği için (paket betikleri, Ansible remote_tmp) yalnızca raporlanır; tasarım: docs/design/grup3-tmp-su-root.md ---
- name: Temporary directory mount report (read-only)
  when: hardening_tmp_report | bool
  block:
    - name: Read the mounts behind /tmp and /dev/shm
      ansible.builtin.shell:
        cmd: |
          for t in /tmp /dev/shm; do
            echo "$t: $(findmnt -n -o TARGET,FSTYPE,OPTIONS --target "$t" 2>/dev/null)"
          done
        executable: /bin/sh
      register: hardening_tmp_mounts
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Evaluate the temporary directory mounts
      ansible.builtin.script:
        cmd: >-
          tmp_report.py {{ {'mounts': hardening_tmp_mounts.stdout_lines | default([]),
          'remote_tmp': ansible_remote_tmp | default('')} | to_json | quote }}
        executable: python3
      register: hardening_tmp_raw
      changed_when: false
      check_mode: false

    - name: Parse the temporary directory report
      ansible.builtin.set_fact:
        hardening_tmp_result: "{{ hardening_tmp_raw.stdout | from_json }}"

    - name: Warn about temporary directory mount problems
      ansible.builtin.debug:
        msg: "UYARI (tmp, CIS 1.1.2): {{ hardening_tmp_result.warnings | join(' ') }} Hiçbir şey değiştirilmedi."
      when: hardening_tmp_result.status == 'warn'

    - name: Show the temporary directory report
      ansible.builtin.debug:
        msg: "NOT (tmp): {{ (hardening_tmp_result.summary ~ ' ' ~ (hardening_tmp_result.notes | join(' '))) | trim }}"
      when: hardening_tmp_result.status != 'unknown' and (hardening_tmp_result.notes | length > 0 or hardening_tmp_result.summary | length > 0)

    - name: Note that the temporary directory report could not be evaluated
      ansible.builtin.debug:
        msg: "UYARI (tmp): rapor değerlendirilemedi: {{ hardening_tmp_result.error }}"
      when: hardening_tmp_result.status == 'unknown'
