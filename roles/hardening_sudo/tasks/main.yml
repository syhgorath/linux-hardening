# sudo ayarları (CIS 5.2.2 use_pty, 5.2.3 logfile, 5.2.6 timestamp_timeout<=15) ve 5.2.5 için SALT OKUNUR tarama.
# /etc/sudoers.d/ altına ayrı bir dosya yazılır (ana /etc/sudoers'a dokunulmaz) ve `visudo -cf` ile doğrulanır.
# RİSK: yanlış sudoers erişimi keser. Bu yüzden yazdıktan hemen sonra `become` ile denenir; başarısızsa dosya silinmeye çalışılır ve rol DURUR.
# Geri alma güvenlik ağı sudoers'ı geri almaz. Rol ssh'tan SONRA çalışır; mevcut bağlantıda `become` denemesi rolün kendi içindedir (yeni bağlantıda become denenmez).
- name: Sudo settings (CIS)
  when: hardening_sudo_enabled | bool
  block:
    # Ubuntu 26.04'te varsayılan sudo-rs'tir ve `Defaults logfile` desteklemez ("unknown setting: 'logfile'", gerçek VM'de görüldü); olaylarını syslog/journald'e yazar
    # (CIS 5.2.3 yöntem A). Klasik sudo'da dosyaya yazılır. Doğrulayıcı (visudo) hangisiyse ona göre karar verilir.
    - name: Detect the sudo implementation (visudo --version)
      ansible.builtin.command: visudo --version
      become: false
      register: hardening_sudo_visudo_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remember whether sudo-rs is in use
      ansible.builtin.set_fact:
        hardening_sudo_is_rs: "{{ 'visudo-rs' in (hardening_sudo_visudo_version.stdout | default('')) }}"

    - name: Write sudoers drop-in (use_pty, logfile, timestamp_timeout)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/60-hardening
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          # Ansible tarafından yönetilir
          Defaults use_pty
          {% if not hardening_sudo_is_rs %}
          Defaults logfile="{{ hardening_sudo_logfile }}"
          {% endif %}
          Defaults timestamp_timeout=15

    - name: Check that privilege escalation still works
      ansible.builtin.command: id -u
      become: true
      register: hardening_sudo_probe
      changed_when: false
      check_mode: false
      failed_when: hardening_sudo_probe.stdout | trim != '0'
      when: not ansible_check_mode

    # 5.2.5: sudoers'ta "!authenticate" (parolasız/yeniden kimlik doğrulamasız sudo) olmamalı. Dosyaları DEĞİŞTİRMEYİZ (kasıtlı olabilir): yalnızca uyarırız.
    - name: Look for '!authenticate' in sudoers (read-only)
      ansible.builtin.shell:
        cmd: grep -rEn '^[^#]*!authenticate' /etc/sudoers /etc/sudoers.d 2>/dev/null || true
      register: hardening_sudo_noauth
      changed_when: false
      check_mode: false

    - name: Warn about '!authenticate'
      ansible.builtin.debug:
        msg: >-
          UYARI (sudo, CIS 5.2.5): sudoers içinde "!authenticate" var, yani bazı kullanıcılar parola sormadan sudo kullanıyor: {{ hardening_sudo_noauth.stdout_lines | join(' | ') }}.
          Bu bilinçli olabilir (otomasyon); değiştirilmedi.
      when: hardening_sudo_noauth.stdout_lines | length > 0

  rescue:
    - name: Remove the sudoers drop-in after a failure
      ansible.builtin.file:
        path: /etc/sudoers.d/60-hardening
        state: absent
      failed_when: false  # become çalışmıyorsa silinemeyebilir; aşağıdaki hata mesajı bunu söyler

    - name: Stop after sudo failure
      ansible.builtin.fail:
        msg: >-
          sudo ayarı uygulanamadı ya da sonrasında yetki yükseltme çalışmadı; /etc/sudoers.d/60-hardening silinmeye çalışıldı. Sunucuda doğrulayın:
          ls -l /etc/sudoers.d/60-hardening (kalmışsa root olarak silin).

# su kısıtı (CIS 5.2.7), varsayılan KAPALI. /etc/pam.d/su'ya `pam_wheel` satırı eklenir: yalnızca <hardening_su_group> üyeleri su yapabilir; grup varsayılan
# olarak BOŞ oluşturulur, yani root dışında kimse su yapamaz (root pam_rootok ile geçer). sudo, ssh ve konsol girişi etkilenmez. Üye eklenmez.
- name: Restrict su to a group (CIS 5.2.7)
  when: hardening_su_restrict | bool
  block:
    - name: Check the su group name
      ansible.builtin.assert:
        that: hardening_su_group is match('^[a-z_][a-z0-9_-]{0,31}$')
        fail_msg: "hardening_su_group geçerli bir grup adı değil (küçük harf, rakam, _ ve -; en çok 32 karakter): {{ hardening_su_group }}"
        quiet: true

    - name: Make sure the su group exists (empty when created here)
      ansible.builtin.group:
        name: "{{ hardening_su_group }}"
        state: present
        system: true

    - name: Require membership of the su group in /etc/pam.d/su
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^\s*auth\s+(required|requisite)\s+pam_wheel\.so'
        insertafter: '^\s*auth\s+sufficient\s+pam_rootok\.so'
        line: "auth       required   pam_wheel.so use_uid group={{ hardening_su_group }}"
        owner: root
        group: root
        mode: "0644"
