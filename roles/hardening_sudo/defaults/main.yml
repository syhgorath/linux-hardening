# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# false: rol hiçbir şey yapmaz (kaçış anahtarı).
hardening_sudo_enabled: true
# sudo komutlarının kaydı (CIS 5.2.3), YALNIZCA klasik sudo'da yazılır (sudo-rs `logfile` desteklemez; olaylar journald'e gider). Dosyayı sudo ilk kullanımda kendisi oluşturur.
hardening_sudo_logfile: /var/log/sudo.log
