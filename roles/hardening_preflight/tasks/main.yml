# Platform (docs/design/proxmox-host.md soru 5): `hardening_platform` generic | proxmox-host. Bu denetimler `hardening_allow_unsupported` ile ATLANAMAZ ve `--check`'te de çalışır.
#   - Proxmox VE hostu (/etc/pve ya da /usr/bin/pveversion) `generic` platformla ASLA sertleştirilmez: Ubuntu kuralları (root girişi, ufw, MTA değişimi, ip_forward) hostu ve VM ağını bozar.
#   - `proxmox-host` platformu yalnızca GERÇEKTEN Proxmox olan hostta kabul edilir; gerçek değişiklik için ayrıca hardening_pve_apply=true gerekir (aşağıya bak; eskiden: pve-firewall + geri alma kapsamı bekliyor).
- name: Check the platform setting
  ansible.builtin.assert:
    that: hardening_platform in hardening_platforms_known
    fail_msg: "hardening_platform geçersiz: {{ hardening_platform }}. Geçerli değerler: {{ hardening_platforms_known | join(', ') }}."
    quiet: true

- name: Look for Proxmox VE markers
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ hardening_proxmox_markers }}"
  register: hardening_proxmox_stat
  check_mode: false

- name: Remember whether this is a Proxmox VE host
  ansible.builtin.set_fact:
    hardening_is_proxmox: "{{ hardening_proxmox_stat.results | selectattr('stat.exists') | list | length > 0 }}"
    # preflight'ın varsayılanları yalnızca bu role görünür: platformu diğer rollere de görünür (kalıcı) yapmak için burada yeniden yayınlanır.
    hardening_platform: "{{ hardening_platform }}"
    hardening_platform_relaxed: "{{ hardening_platform == 'proxmox-host' and not (hardening_pve_strict | bool) }}"

- name: Refuse to run on a Proxmox VE host
  ansible.builtin.fail:
    msg: >-
      Bu sunucu bir Proxmox VE hostu ({{ hardening_proxmox_stat.results | selectattr('stat.exists') | map(attribute='item') | join(', ') }} var). `generic` platformla
      sertleştirilmez; hiçbir bayrak (hardening_allow_unsupported dahil) bu denetimi atlatmaz. Proxmox üstündeki sıradan Ubuntu VM'leri etkilenmez.
      Yalnızca önizleme için: --check -e hardening_platform=proxmox-host. docs/design/proxmox-host.md'ye bak.
  when: hardening_is_proxmox | bool and hardening_platform != 'proxmox-host'

- name: Refuse the proxmox-host platform on a host that is not Proxmox VE
  ansible.builtin.fail:
    msg: >-
      hardening_platform=proxmox-host seçildi ama bu sunucu Proxmox VE değil ({{ hardening_proxmox_markers | join(', ') }} yok). Platformu `generic` bırakın ya da doğru sunucuyu seçin.
  when: hardening_platform == 'proxmox-host' and not (hardening_is_proxmox | bool)

# Proxmox'ta GERÇEK değişiklik bilinçli bir kapıdan geçer (yanlış ayar hipervizörü ve VM'leri etkiler): hardening_pve_apply=true. Önizleme (--check) her zaman serbesttir.
# Bu kapı hardening_allow_unsupported ile ATLANAMAZ. Güvenlik duvarı ayrı playbook'ta yönetilir (playbooks/pve-firewall.yml, aynı değişken).
- name: Refuse real changes on a Proxmox VE host unless hardening_pve_apply is true
  ansible.builtin.fail:
    msg: >-
      Proxmox VE hostunda gerçek değişiklik için hardening_pve_apply=true gerekir (yanlış ayar hipervizörü ve VM'leri etkileyebilir; önce snapshot alın, önce --check ile bakın).
      Hiçbir şey değiştirilmedi. docs/design/proxmox-host.md'ye bak.
  when: hardening_platform == 'proxmox-host' and not ansible_check_mode and not (hardening_pve_apply | default(false) | bool)

# Raspberry Pi (docs/design/raspberry-pi.md): Pi algılanması BİLGİ amaçlıdır (generic platform reddedilmez, Pi'de Ubuntu/Debian sıradan çalışır); `raspberry-pi` platformu yalnızca GERÇEK Pi'de kabul edilir.
- name: Look for Raspberry Pi markers
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ hardening_rpi_markers }}"
  register: hardening_rpi_stat
  check_mode: false

- name: Remember whether this is a Raspberry Pi
  ansible.builtin.set_fact:
    hardening_is_rpi: "{{ hardening_rpi_stat.results | selectattr('stat.exists') | list | length > 0 }}"
    # Yalnızca usb-storage engelini gevşetir (Pi USB'den açılabilir); sysctl/noexec gevşetilmez.
    hardening_rpi_relaxed: "{{ hardening_platform == 'raspberry-pi' and not (hardening_rpi_strict | bool) }}"

- name: Refuse the raspberry-pi platform on a host that is not a Raspberry Pi
  ansible.builtin.fail:
    msg: >-
      hardening_platform=raspberry-pi seçildi ama bu sunucu bir Raspberry Pi değil ({{ hardening_rpi_markers | join(', ') }} yok).
      Pi olmayan sunucu için platformu `generic` bırakın; bu denetim hardening_allow_unsupported ile atlanamaz.
  when: hardening_platform == 'raspberry-pi' and not (hardening_is_rpi | bool)

- name: Note a Raspberry Pi that is hardened with the generic platform
  ansible.builtin.debug:
    msg: >-
      NOT (raspberry-pi): bu sunucu bir Raspberry Pi gibi görünüyor ama platform generic. usb-storage engeli USB diskten/SSD'den açılan ya da USB depolama kullanan Pi'de
      erişimi keser; bu durumda hardening_platform=raspberry-pi verin (docs/design/raspberry-pi.md). Hiçbir şey durdurulmadı.
  when: hardening_is_rpi | bool and hardening_platform == 'generic'

# Proxmox KÜMESİ: düğümler arası işlemler (pvecm, migration, replikasyon) kökten SSH ister. PermitRootLogin no kümeyi bozar: kullanıcı bilerek prohibit-password seçmeli.
- name: Look for the Proxmox cluster marker
  ansible.builtin.stat:
    path: "{{ hardening_pve_cluster_marker }}"
  register: hardening_pve_cluster_stat
  check_mode: false
  when: hardening_platform == 'proxmox-host'

- name: Refuse PermitRootLogin no on a Proxmox VE cluster node
  ansible.builtin.fail:
    msg: >-
      Bu Proxmox VE düğümü bir kümenin parçası ({{ hardening_pve_cluster_marker }} var). Kümede düğümler arası işlemler kökten SSH ister; PermitRootLogin no kümeyi bozar.
      hardening_ssh_permit_root_login: "prohibit-password" verin (yalnızca anahtarla kök girişi) ve düğümler arası anahtarların çalıştığını doğrulayın.
  when:
    - hardening_platform == 'proxmox-host'
    - hardening_pve_cluster_stat.stat.exists | default(false)
    - hardening_ssh_permit_root_login | default('no') == 'no'

# Debian'da ansible_facts['distribution_version'] alt sürümü de içerir ("13.7"), Ubuntu'da değil ("26.04"): Debian için ANA sürüm ("13") kullanılır.
- name: Work out the version key used for the support check and OS variables
  ansible.builtin.set_fact:
    hardening_os_version: >-
      {{ ansible_facts['distribution_major_version'] if ansible_facts['distribution'] == 'Debian' else ansible_facts['distribution_version'] }}

- name: Check distribution and version are supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in hardening_supported_os
      - hardening_os_version in hardening_supported_os[ansible_facts['distribution']]
    fail_msg: >-
      Desteklenmeyen sistem: {{ ansible_facts['distribution'] }} {{ hardening_os_version }}.
      Desteklenenler: {{ hardening_supported_os }}. docs/SUPPORT.md'ye bak.
  when: not hardening_allow_unsupported

# apt modülü `--check` modunda python3-apt ister (gerçek koşuda kendisi kurar). Ubuntu imajlarında hazır gelir, minimal Debian'da olmayabilir: anlaşılır hata ver.
- name: Check that the apt module can run in check mode (python3-apt)
  ansible.builtin.command: /usr/bin/python3 -c 'import apt_pkg'
  register: hardening_preflight_python_apt
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_check_mode and ansible_facts['os_family'] == 'Debian'

- name: Stop the preview when python3-apt is missing
  ansible.builtin.fail:
    msg: >-
      Önizleme (--check) için hedefte python3-apt gerekir ve kurulu değil (apt modülü bunsuz --check'te çalışmaz). Kurun:
      `sudo apt-get install -y python3-apt` ya da önce bir kez --check OLMADAN çalıştırın (gerçek koşu bunu kendisi kurar).
  when:
    - ansible_check_mode
    - ansible_facts['os_family'] == 'Debian'
    - hardening_preflight_python_apt.rc | default(0) != 0

- name: Load OS/version specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | lower }}-{{ hardening_os_version }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}.yml"
      paths:
        - "{{ playbook_dir }}/../vars"
