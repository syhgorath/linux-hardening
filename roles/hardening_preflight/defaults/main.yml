# Desteklenen dagitim ve surumler. Yeni surum eklemek: vars/<dagitim>-<surum>.yml olustur,
# buraya ekle, docs/SUPPORT.md'yi guncelle.
hardening_supported_os:
  Ubuntu: ["26.04"]
  Debian: ["13"]
# Desteklenmeyen surumde zorla calistirmak icin (onerilmez): -e hardening_allow_unsupported=true
hardening_allow_unsupported: false
# Ek ufw kurallarının geçerli biçimi: hardening_ufw rolündeki hardening_ufw_extra_allow_pattern ile AYNI olmalı (test/test_ufw_extra_allow.py denetler).
# Burada olması, geçersiz kuralın ağır roller (AIDE ilk veritabanı dakikalar sürer) çalışmadan, daha en başta yakalanması içindir.
hardening_preflight_extra_allow_pattern: '^([0-9]{1,5}(:[0-9]{1,5})?(/(tcp|udp))?|from (any|[0-9A-Fa-f:.]+(/[0-9]{1,3})?) to any port [0-9]{1,5}(:[0-9]{1,5})? proto (tcp|udp))$'
# Proxmox VE hostu işaretleri (herhangi biri varsa rol DURUR; hardening_allow_unsupported bunu atlatmaz). Yalnızca TEST için değiştirilir.
hardening_proxmox_markers:
  - /etc/pve
  - /usr/bin/pveversion
# Platform: generic (varsayılan) | proxmox-host. Proxmox VE hostu `generic` ile sertleştirilemez (rol durur); `proxmox-host` şimdilik YALNIZCA --check önizlemesi içindir.
hardening_platform: generic
hardening_platforms_known: [generic, proxmox-host]
# true: Proxmox hostunda da genel politika varsayılanları uygulanır (/tmp ve /dev/shm noexec, usb-storage engeli). Varsayılan false: Proxmox iş akışlarını (yedek diski, şablon/ISO çalıştırma) bozmasın.
hardening_pve_strict: false
