# Not: login.defs değerleri sadece YENİ hesapları etkiler; mevcut kullanıcılara dokunmaz (kilitlenme riski yok).
- name: Install libpam-pwquality
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Set login.defs password aging and umask
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*#?\s*{{ item.key }}\b'
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: PASS_MAX_DAYS, value: "{{ hardening_pass_max_days }}" }
    - { key: PASS_MIN_DAYS, value: "{{ hardening_pass_min_days }}" }
    - { key: PASS_WARN_AGE, value: "{{ hardening_pass_warn_age }}" }
    - { key: UMASK, value: "{{ hardening_umask }}" }
    - { key: SHA_CRYPT_MIN_ROUNDS, value: "65536" }
    - { key: SHA_CRYPT_MAX_ROUNDS, value: "65536" }

- name: Ensure pwquality.conf.d exists
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    mode: "0755"

- name: Configure pwquality policy
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf.d/90-hardening.conf
    owner: root
    group: root
    mode: "0644"

# --- Kabuk boşta kalma süresi (varsayılan KAPALI) ---
- name: Validate shell timeout
  ansible.builtin.assert:
    that:
      - (hardening_shell_timeout_seconds | string) is match('^[0-9]+$')
      - hardening_shell_timeout_seconds | int >= 0
      - hardening_shell_timeout_seconds | int <= 900
    fail_msg: "hardening_shell_timeout_seconds 0 (kapalı) ile 900 arasında olmalı (CIS: en çok 900)."

- name: Idle shell timeout (TMOUT)
  ansible.builtin.copy:
    dest: /etc/profile.d/60-hardening-tmout.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible tarafından yönetilir
      readonly TMOUT={{ hardening_shell_timeout_seconds | int }}
      export TMOUT
  when: hardening_shell_timeout_seconds | int > 0

# --- Parola INACTIVE (varsayılan KAPALI): yeni hesaplar için varsayılan; mevcutlara dokunulmaz ---
- name: Validate password inactive days
  ansible.builtin.assert:
    that:
      - (hardening_password_inactive_days | string) is match('^[0-9]+$')
      - hardening_password_inactive_days | int >= 0
      - hardening_password_inactive_days | int <= 365
    fail_msg: "hardening_password_inactive_days 0 (kapalı) ile 365 arasında olmalı (CIS: en çok 45)."

- name: Read the default INACTIVE for new accounts
  ansible.builtin.command: useradd -D
  register: hardening_auth_inactive_now
  changed_when: false
  check_mode: false
  when: hardening_password_inactive_days | int > 0

- name: Set the default INACTIVE for new accounts
  ansible.builtin.command: "useradd -D -f {{ hardening_password_inactive_days | int }}"
  changed_when: true
  when: hardening_password_inactive_days | int > 0 and (hardening_auth_inactive_now.stdout | regex_search('INACTIVE=(-?[0-9]+)', '\\1') | first | default('')) != (hardening_password_inactive_days | int | string)

- name: List existing accounts whose INACTIVE differs (read-only)
  ansible.builtin.shell:
    cmd: "awk -F: -v n={{ hardening_password_inactive_days | int }} '$2 ~ /^[$]/ && $7 != n {print $1}' {{ hardening_auth_shadow_path }}"
  register: hardening_auth_inactive_other
  changed_when: false
  check_mode: false
  when: hardening_password_inactive_days | int > 0

- name: Warn about existing accounts with a different INACTIVE
  ansible.builtin.debug:
    msg: >-
      UYARI (parola INACTIVE): {{ hardening_auth_inactive_other.stdout_lines | length }} mevcut hesapta INACTIVE {{ hardening_password_inactive_days | int }} değil
      ({{ hardening_auth_inactive_other.stdout_lines | join(', ') }}). Mevcut hesaplar DEĞİŞTİRİLMEDİ (süre dolunca kilitlenme riski);
      istediğiniz hesap için elle: chage -I {{ hardening_password_inactive_days | int }} <kullanıcı>.
  when: hardening_password_inactive_days | int > 0 and hardening_auth_inactive_other.stdout_lines | length > 0

# --- Oturum başına özel geçici dizin (libpam-tmpdir; paket kurulumunda pam-auth-update ile PAM'e eklenir) ---
- name: Install libpam-tmpdir
  ansible.builtin.apt:
    name: libpam-tmpdir
    state: present
  when: hardening_pam_tmpdir | bool

# --- root ortamı raporu (CIS 5.4.2: PATH bütünlüğü ve umask). SALT OKUNUR: hiçbir şeyi değiştirmez; `--check`'te de çalışır. Karar mantığı files/root_env_report.py ---
- name: Root environment report (read-only)
  when: hardening_root_env_report | bool
  block:
    - name: Read root's login PATH
      # `command` modülü komut satırındaki $PATH'i KENDİSİ açar (sudo'nun PATH'i gelirdi); `shell` ile tek tırnak bunu korur.
      ansible.builtin.shell:
        cmd: env -i HOME=/root bash -lc 'echo "$PATH"'
        executable: /bin/sh
      become: true
      register: hardening_root_env_path
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Inspect the directories in root's PATH
      ansible.builtin.shell:
        cmd: |
          IFS=:
          for d in $HARDENING_ROOT_PATH; do
            [ -n "$d" ] || continue
            if [ -e "$d" ]; then stat -L -c '%a %U %n' "$d"; else echo "MISSING - $d"; fi
          done
        executable: /bin/sh
      environment:
        HARDENING_ROOT_PATH: "{{ hardening_root_env_path.stdout | default('') | trim }}"
      register: hardening_root_env_dirs
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the umask settings that apply to root (read-only)
      ansible.builtin.shell:
        cmd: |
          awk '/^[[:space:]]*UMASK[[:space:]]/ {print "LOGINDEFS:" $2}' /etc/login.defs 2>/dev/null
          grep -Eq '^[[:space:]]*session[[:space:]]+[^#]*pam_umask\.so' /etc/pam.d/common-session 2>/dev/null && echo "PAMUMASK:yes"
          for f in /root/.bashrc /root/.bash_profile /root/.profile /etc/profile /etc/bash.bashrc /etc/profile.d/*.sh; do
            [ -f "$f" ] && awk -v f="$f" '/^[[:space:]]*umask[[:space:]]/ {print f ":" $0}' "$f" 2>/dev/null
          done
          true
        executable: /bin/sh
      become: true
      register: hardening_root_env_umask
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Evaluate the root environment
      ansible.builtin.script:
        cmd: >-
          root_env_report.py {{ {'path': hardening_root_env_path.stdout | default('') | trim,
          'dirs': hardening_root_env_dirs.stdout_lines | default([]),
          'login_defs_umask': (hardening_root_env_umask.stdout_lines | default([]) | select('match', '^LOGINDEFS:') | map('regex_replace', '^LOGINDEFS:', '') | list | first | default('')),
          'pam_umask': 'PAMUMASK:yes' in (hardening_root_env_umask.stdout_lines | default([])),
          'file_umasks': hardening_root_env_umask.stdout_lines | default([]) | reject('match', '^(LOGINDEFS|PAMUMASK):') | list} | to_json | quote }}
        executable: python3
      register: hardening_root_env_raw
      changed_when: false
      check_mode: false

    - name: Parse the root environment report
      ansible.builtin.set_fact:
        hardening_root_env_result: "{{ hardening_root_env_raw.stdout | from_json }}"

    - name: Show the root environment report
      ansible.builtin.debug:
        msg: "ROOT ORTAMI: {{ hardening_root_env_result.summary }}"
      when: hardening_root_env_result.status == 'ok'

    - name: Warn about root environment problems
      ansible.builtin.debug:
        msg: "UYARI (root ortamı, CIS 5.4.2, PATH/umask): {{ hardening_root_env_result.messages | join(' ') }} Hiçbir şey değiştirilmedi."
      when: hardening_root_env_result.status == 'warn'

    - name: Note that the root environment report could not be evaluated
      ansible.builtin.debug:
        msg: "UYARI (root ortamı): rapor değerlendirilemedi: {{ hardening_root_env_result.error }}"
      when: hardening_root_env_result.status == 'unknown'
