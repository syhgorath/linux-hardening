# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# Not: login.defs değerleri sadece YENİ hesapları etkiler.
hardening_pass_max_days: 365
hardening_pass_min_days: 1
hardening_pass_warn_age: 7
hardening_umask: "027"
hardening_pwquality_minlen: 14
# Etkileşimli kabuk boşta kalma süresi (saniye, CIS TMOUT): 0 = KAPALI (varsayılan), 1..900. Açılınca /etc/profile.d/60-hardening-tmout.sh yazılır
# (`readonly TMOUT=N`); boşta kalan kabuk oturumları kapanır (uzun süren elle işler, `screen`/`tmux` dışındaki oturumlar etkilenir).
hardening_shell_timeout_seconds: 0
# Parola süresi dolduktan sonra hesabın kilitleneceği gün sayısı (CIS INACTIVE): 0 = KAPALI (varsayılan), 1..365. Açılınca `useradd -D -f N` YENİ hesaplar için
# varsayılan yapar; MEVCUT hesaplar DEĞİŞTİRİLMEZ (kilitlenme riski), farklı olanlar uyarıyla listelenir.
hardening_password_inactive_days: 0
# Yalnızca TEST için: shadow dosyasının yolu.
hardening_auth_shadow_path: /etc/shadow
# true (varsayılan): libpam-tmpdir kurulur (Lynis DEB-0280): her oturum için özel, 0700 bir geçici dizin (/tmp/user/<uid>) ve $TMP/$TMPDIR; /tmp'te sembolik bağ yarışlarını azaltır.
# Bedeli: $TMPDIR artık /tmp değildir; /tmp'i sabit varsayan betikler ve oturumlar arası paylaşılan geçici dosyalar etkilenebilir.
hardening_pam_tmpdir: true
# true (varsayılan): root ortamı SALT OKUNUR raporu (CIS 5.4.2: root PATH bütünlüğü ve root umask). Hiçbir şeyi DEĞİŞTİRMEZ, yalnızca uyarır; `--check`'te de çalışır.
hardening_root_env_report: true
# Parola geçmişi (pam_pwhistory, CIS 5.3.3.3.x): 0 = KAPALI (varsayılan); 1..400 = bu kadar eski parola hatırlanır ve yeniden kullanılamaz (CIS 24). Açılınca
# /usr/share/pam-configs/hardening-pwhistory profili yazılıp `pam-auth-update` ile etkinleştirilir ve /etc/security/pwhistory.conf'a `remember` yazılır.
# Bedeli: parolayı betikle (chpasswd vb.) değiştiren otomasyon, daha önce kullanılmış bir parolayı tekrar atayamaz. Yalnızca PAROLA DEĞİŞTİRMEYİ etkiler, girişi/sudo'yu değil.
# 0'a geri almak profili SİLMEZ (bkz. docs/known-issues.md).
hardening_pam_pwhistory_remember: 0
# true: geçmiş kuralı root'un parola değişikliğine de uygulanır (pwhistory enforce_for_root). Varsayılan false (Ubuntu'da root parolası zaten kilitli).
hardening_pam_pwhistory_enforce_for_root: false
