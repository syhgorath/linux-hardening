- name: Validate SSH variables
  ansible.builtin.assert:
    that:
      - hardening_ssh_kbdinteractive in [true, false]
      - hardening_ssh_allow_tcp_forwarding in ['no', 'local', 'remote', 'yes']
    fail_msg: >-
      Geçersiz SSH değişkeni. hardening_ssh_kbdinteractive true/false (bool) olmalı;
      hardening_ssh_allow_tcp_forwarding no|local|remote|yes (string) olmalı
      (YAML'da 'no' tırnaksız bool'a dönüşür: "no" yazın).

- name: Login user (become olmadan)
  ansible.builtin.command: id -un
  become: false
  register: hardening_ssh_login_user
  changed_when: false
  check_mode: false
  when: hardening_ssh_disable_password

- name: Login user's real home directory (getent passwd)
  ansible.builtin.getent:
    database: passwd
    key: "{{ hardening_ssh_login_user.stdout }}"
  when: hardening_ssh_disable_password

- name: Authorized key must exist before disabling password auth
  ansible.builtin.stat:
    path: "{{ ansible_facts['getent_passwd'][hardening_ssh_login_user.stdout][4] }}/.ssh/authorized_keys"
  register: hardening_ssh_keys
  when: hardening_ssh_disable_password

- name: Refuse to continue without a usable key (erişim kaybını önler)
  ansible.builtin.assert:
    that:
      - hardening_ssh_keys.stat.exists
      - hardening_ssh_keys.stat.size > 0
    fail_msg: >-
      {{ hardening_ssh_login_user.stdout }} için
      {{ ansible_facts['getent_passwd'][hardening_ssh_login_user.stdout][4] }}/.ssh/authorized_keys yok ya da boş;
      parola girişi kapatılmadı.
  when: hardening_ssh_disable_password

- name: "Write sshd drop-in (00- oneki: cloud-init drop-in dosyasindan once okunur)"
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
