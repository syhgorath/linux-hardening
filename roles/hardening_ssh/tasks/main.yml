- name: Validate SSH variables
  ansible.builtin.assert:
    that:
      - hardening_ssh_kbdinteractive in [true, false]
      - hardening_ssh_allow_tcp_forwarding in ['no', 'local', 'remote', 'yes']
      - hardening_ssh_permit_root_login in ['no', 'prohibit-password']
    fail_msg: >-
      Geçersiz SSH değişkeni. hardening_ssh_kbdinteractive true/false (bool) olmalı;
      hardening_ssh_allow_tcp_forwarding no|local|remote|yes (string) olmalı;
      hardening_ssh_permit_root_login no|prohibit-password (string) olmalı
      (YAML'da 'no' tırnaksız bool'a dönüşür: "no" yazın).

- name: Validate MaxSessions (CIS allows at most 10)
  ansible.builtin.assert:
    that:
      - hardening_ssh_max_sessions is integer
      - hardening_ssh_max_sessions >= 1 and hardening_ssh_max_sessions <= 10
    fail_msg: "hardening_ssh_max_sessions 1 ile 10 arasında bir tam sayı olmalı (CIS en çok 10 ister)."

- name: Validate the sshd tuning values
  ansible.builtin.assert:
    that:
      - hardening_ssh_max_auth_tries is integer and hardening_ssh_max_auth_tries >= 1 and hardening_ssh_max_auth_tries <= 10
      - hardening_ssh_login_grace_time is integer and hardening_ssh_login_grace_time >= 1 and hardening_ssh_login_grace_time <= 600
      - hardening_ssh_log_level in ['QUIET', 'FATAL', 'ERROR', 'INFO', 'VERBOSE']
      - hardening_ssh_max_startups | string is match('^[0-9]+(:[0-9]+:[0-9]+)?$')
      - hardening_ssh_client_alive_interval is integer and hardening_ssh_client_alive_interval >= 0 and hardening_ssh_client_alive_interval <= 3600
      - hardening_ssh_client_alive_count_max is integer and hardening_ssh_client_alive_count_max >= 0 and hardening_ssh_client_alive_count_max <= 10
      - hardening_ssh_x11_forwarding in [true, false]
      - hardening_ssh_agent_forwarding in [true, false]
    fail_msg: >-
      Geçersiz sshd ayarı. hardening_ssh_max_auth_tries 1-10, hardening_ssh_login_grace_time 1-600 (saniye), hardening_ssh_log_level QUIET|FATAL|ERROR|INFO|VERBOSE,
      hardening_ssh_max_startups sayı ya da sayı:sayı:sayı (örn. 10:30:60), hardening_ssh_client_alive_interval 0-3600, hardening_ssh_client_alive_count_max 0-10 (tamsayı),
      hardening_ssh_x11_forwarding ve hardening_ssh_agent_forwarding true/false (bool) olmalı.

- name: Validate the SSH access lists (CIS 5.1.5)
  ansible.builtin.assert:
    that:
      - hardening_ssh_allow_users is sequence and hardening_ssh_allow_users is not string
      - hardening_ssh_allow_groups is sequence and hardening_ssh_allow_groups is not string
      - (hardening_ssh_allow_users + hardening_ssh_allow_groups) | reject('match', '^[a-z_][a-z0-9_-]*[$]?$') | list | length == 0
    fail_msg: >-
      hardening_ssh_allow_users / hardening_ssh_allow_groups geçersiz: liste olmalı, girdiler yalnızca basit ad olmalı (küçük harf, rakam, _ ve -; joker, @ ve ! yok).
      Geçersiz girdiler: {{ ((hardening_ssh_allow_users | default([])) + (hardening_ssh_allow_groups | default([]))) | reject('match', '^[a-z_][a-z0-9_-]*[$]?$') | list }}

- name: Login user and groups for the access lists (become olmadan)
  ansible.builtin.shell:
    cmd: |
      id -un
      id -Gn
    executable: /bin/sh
  become: false
  register: hardening_ssh_access_who
  changed_when: false
  check_mode: false
  when: hardening_ssh_allow_users | length > 0 or hardening_ssh_allow_groups | length > 0

- name: Refuse access lists that would lock out the login user
  ansible.builtin.assert:
    that:
      - hardening_ssh_allow_users | length == 0 or hardening_ssh_access_who.stdout_lines[0] in hardening_ssh_allow_users
      - hardening_ssh_allow_groups | length == 0 or (hardening_ssh_access_who.stdout_lines[1].split() | intersect(hardening_ssh_allow_groups) | length > 0)
    fail_msg: >-
      Ansible'ın bağlandığı kullanıcı ({{ hardening_ssh_access_who.stdout_lines[0] }}, grupları: {{ hardening_ssh_access_who.stdout_lines[1] }}) hardening_ssh_allow_users /
      hardening_ssh_allow_groups ile SSH girişine izinli değil; yazılsaydı bu bağlantı yenilenemez, erişim kesilirdi. Hiçbir şey yazılmadı.
  when: hardening_ssh_allow_users | length > 0 or hardening_ssh_allow_groups | length > 0

- name: Login user (become olmadan)
  ansible.builtin.command: id -un
  become: false
  register: hardening_ssh_login_user
  changed_when: false
  check_mode: false
  when: hardening_ssh_disable_password

- name: Login user's real home directory (getent passwd)
  ansible.builtin.getent:
    database: passwd
    key: "{{ hardening_ssh_login_user.stdout }}"
  when: hardening_ssh_disable_password

- name: Authorized key must exist before disabling password auth
  ansible.builtin.stat:
    path: "{{ ansible_facts['getent_passwd'][hardening_ssh_login_user.stdout][4] }}/.ssh/authorized_keys"
  register: hardening_ssh_keys
  when: hardening_ssh_disable_password

- name: Refuse to continue without a usable key (erişim kaybını önler)
  ansible.builtin.assert:
    that:
      - hardening_ssh_keys.stat.exists
      - hardening_ssh_keys.stat.size > 0
    fail_msg: >-
      {{ hardening_ssh_login_user.stdout }} için
      {{ ansible_facts['getent_passwd'][hardening_ssh_login_user.stdout][4] }}/.ssh/authorized_keys yok ya da boş;
      parola girişi kapatılmadı.
  when: hardening_ssh_disable_password

- name: "Write sshd drop-in (00- oneki: cloud-init drop-in dosyasindan once okunur)"
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
