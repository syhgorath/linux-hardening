# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# Anahtar yoksa rol zaten durur (authorized_keys kontrolü).
hardening_ssh_disable_password: true

# 2FA/TOTP (keyboard-interactive) kullananlar için. Varsayılan false (davranış değişmez).
# true ise sshd'ye AuthenticationMethods publickey,keyboard-interactive yazılır: anahtar VE PAM istemi birlikte
# gerekir (parola tek başına yetmez). Sunucuda PAM'ın 2FA'yı (örn. libpam-google-authenticator) ayrıca
# yapılandırılması gerekir; bu rol bunu yapmaz. Yanlış yapılandırma erişimi keser: önce test sunucusunda deneyin.
hardening_ssh_kbdinteractive: false
# ProxyJump/tünel kullananlar için: no | local | remote | yes. Varsayılan no (davranış değişmez).
# ProxyJump için jump host'ta en az "local" gerekir; "yes" gereksiz geniştir.
hardening_ssh_allow_tcp_forwarding: "no"
# PermitRootLogin değeri: "no" (varsayılan) | "prohibit-password" (yalnızca anahtarla). `no` kök girişini tamamen kapatır. Proxmox VE KÜMESİNDE düğümler arası işlemler kökten SSH ister:
# orada "prohibit-password" gerekir (preflight kümede "no" ile durur). Parola ile kök girişi hiçbir ayarla açılmaz. YAML'da no tırnaksız bool olur: "no" yazın.
hardening_ssh_permit_root_login: "no"
# Erişim kısıtı (CIS 5.1.5): yalnızca bu kullanıcılar / gruplar SSH ile girebilir (sshd AllowUsers / AllowGroups). Varsayılan BOŞ = kısıt yok (davranış değişmez).
# İkisi de doluysa sshd bunları VE ile birleştirir (hem kullanıcı hem grup listesinde olmak gerekir). Ansible'ın bağlandığı kullanıcı listede (ya da gruplarda) YOKSA
# rol hiçbir şey yazmadan DURUR (kendi erişimini kesmeyi önler). Yalnızca basit adlar: harf, rakam, _ ve -; joker, @ ve ! desteklenmez.
hardening_ssh_allow_users: []
hardening_ssh_allow_groups: []
# sshd MaxSessions (CIS: en çok 10). Varsayılan 4: Ansible oturum çoklaması (ControlMaster) bir bağlantıda birden çok oturum açar. Lynis SSH-7408 2 ister; 2'de çoklama
# "channel open failed: administratively prohibited" ile kırılabilir. sshpocket'te denenmeden düşürmeyin.
hardening_ssh_max_sessions: 4
