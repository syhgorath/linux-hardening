# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# true: IPv6 yönlendirici duyurularını (RA) kabul etmeyi kapatır (CIS 3.3.2, accept_ra). Adresini/yolunu yalnızca RA'dan alan
# bir sunucu IPv6 bağlantısını KAYBEDER; bu yüzden varsayılan false.
hardening_kernel_disable_ipv6_ra: false
# true: core dump'lar kapatılır (limits.d `* hard core 0`, systemd-coredump `Storage=none`, `ProcessSizeMax=0`; CIS 1.5 core dump maddeleri).
# Bedeli: bir süreç çöktüğünde çökme dökümü OLMAZ, hata ayıklama (Redis/PHP/Docker çökmeleri) zorlaşır. Varsayılan kapalı.
hardening_disable_coredump: false
# true (varsayılan): dört ek sysctl (Lynis KRNL-6000): kernel.unprivileged_bpf_disabled=1 (ayrıcalıksız eBPF kalıcı kapalı), fs.protected_fifos=2 (sticky dizinlerde başkasının FIFO'sunu açmayı kısıtlar), kernel.sysrq=0 (SysRq tuşları kapalı;
# VM konsolundan "acil yeniden başlatma" kullanılamaz), net.core.bpf_jit_harden=2 (BPF JIT sabit körleme; eBPF yoğun iş yüklerinde küçük bir performans bedeli).
hardening_kernel_extra_sysctl: true
# false (varsayılan, warn_if): true iken kernel.modules_disabled=1 yazılır (Lynis KRNL-6000). YENİDEN BAŞLATMAYA KADAR GERİ ALINAMAZ: bundan sonra HİÇBİR çekirdek modülü yüklenemez
# (Docker overlay/br_netfilter, USB, ağ/ses sürücüleri, ufw'nin ihtiyaç duyduğu modüller). Ayarı sonradan false yapmak canlı değeri değiştirmez; yeniden başlatma gerekir.
hardening_kernel_modules_disabled: false
# Proxmox VE hostunda (hardening_platform=proxmox-host) true REDDEDİLİR: LXC/KVM/bridge/softdog modülleri istek üzerine yüklenir ve kilitten sonra yüklenemez.
# hardening_kernel_modules_disabled=true iken, şu an yüklü modüllere EK olarak önyüklemede kilitten önce yüklenecek modüller (ufw/netfilter ve binfmt_misc). ufw bunlar olmadan
# yeniden başlatmada BAŞLAMAZ ve güvenlik duvarı sessizce kapalı kalır (gerçek Ubuntu VM'inde görüldü). Yeniden başlatmadan sonra `ufw status` ve `systemctl --failed` ile doğrulayın.
hardening_kernel_preload_modules:
  - nf_tables
  - nfnetlink
  - nf_conntrack
  - nf_defrag_ipv4
  - nf_defrag_ipv6
  - nf_log_syslog
  - nf_reject_ipv4
  - nf_reject_ipv6
  - nft_compat
  - nft_limit
  - x_tables
  - xt_addrtype
  - xt_conntrack
  - xt_hl
  - xt_limit
  - xt_LOG
  - xt_tcpudp
  - ipt_REJECT
  - ip6t_REJECT
  - ip6t_rt
  - binfmt_misc
