# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# Kurallar yüklendikten sonra yeniden başlatılacak servisler (auditd'den ÖNCE başlayan süreçler yeniden başlatılana kadar denetlenmez).
# Boş = hiçbir şey yeniden başlatılmaz. Servis kesintisi yaratır; `ssh`/`sshd` yazmayın (bağlantı doğrulaması sonrası elle yapın).
hardening_auditd_restart_services: []
# true: GRUB_CMDLINE_LINUX'a `audit=1` ekler ve update-grub çalıştırır; etkisi YENİDEN BAŞLATMADAN sonra başlar, geri alma güvenlik ağı kapsamında DEĞİLDİR.
hardening_auditd_grub_audit: false
# audit_backlog_limit (CIS 6.2.1): 0 (varsayılan) = dokunulmaz; önerilen 8192. GRUB_CMDLINE_LINUX'a yazılır ve update-grub çalışır; etkisi YENİDEN BAŞLATMADAN sonra başlar,
# geri alma güvenlik ağı kapsamında DEĞİLDİR. /etc/default/grub yoksa (Raspberry Pi, LXC...) dokunulmaz.
hardening_auditd_backlog_limit: 0
# auditd.conf (CIS 6.2.2), varsayılan KAPALI: true iken aşağıdaki değerler /etc/audit/auditd.conf'a yazılır. max_log_file_action=keep_logs günlükleri ASLA silmez
# (disk dolabilir); space_left_action=email bir MTA ister; admin_space_left_action=single düşük diskte tek kullanıcı kipine geçer (konsol gerekir). Değerler site politikasıdır.
hardening_auditd_conf_cis: false
hardening_auditd_conf_values:
  max_log_file: 8
  max_log_file_action: keep_logs
  space_left_action: email
  admin_space_left_action: single
# false (varsayılan, warn_if): true iken disk dolunca / disk hatasında SİSTEM DURDURULUR (disk_full_action = halt, disk_error_action = halt; CIS 6.2.2). Sunucu kapanır, konsol gerekir.
hardening_auditd_disk_full_halt: false
# false (varsayılan, warn_if): true iken /etc/audit/rules.d/99-hardening-finalize.rules ile `-e 2` yazılır (CIS 6.2.3): yeniden başlatmaya kadar audit kuralları DEĞİŞTİRİLEMEZ;
# sonraki koşular kuralları yükleyemez (atlanır ve UYARILIR). Kapatınca dosya silinir ama kilit yeniden başlatmaya kadar sürer.
hardening_auditd_immutable: false
# true (varsayılan): Docker kuruluysa Docker dosyaları/dizinleri için izleme kuralı eklenir (CIS Docker 1.1.x). Yalnızca VAR OLAN yollar için yazılır
# (var olmayan yola kural eklemek yüklemeyi bozar). /var/lib/docker bilerek izlenmez (konteyner çalışırken çok gürültülü).
hardening_auditd_docker_rules: true
hardening_auditd_docker_paths:
  - /usr/bin/dockerd
  - /usr/bin/containerd
  - /usr/bin/containerd-shim
  - /usr/bin/containerd-shim-runc-v1
  - /usr/bin/containerd-shim-runc-v2
  - /usr/bin/runc
  - /etc/docker
  - /etc/docker/daemon.json
  - /etc/default/docker
  - /etc/containerd/config.toml
  - /usr/lib/systemd/system/docker.service
  - /usr/lib/systemd/system/docker.socket
  - /etc/systemd/system/docker.service
  - /etc/systemd/system/docker.socket
  - /run/docker.sock
  - /run/containerd/containerd.sock
# CIS Level 2 denetim kuralları (6.2.3.x) ve auditd dosya/araç izinleri (6.2.4.x). Varsayılan KAPALI: true iken /etc/audit/rules.d/61-hardening-cis-l2.rules yazılır
# (ayrıcalıklı komutlar, başarısız dosya erişimleri, chmod/chown/xattr, silme/yeniden adlandırma, mount, oturum, PAM/nsswitch/hosts/issue izleme...) ve audit günlük/yapılandırma/araç
# dosyalarının izinleri sıkılaştırılır. BEDELİ: günlük hacmi ciddi artar (başarısız erişimler ve her dosya silme/yeniden adlandırma kayda geçer), disk dolabilir. `-e 2` (değiştirilemez
# yapılandırma, 6.2.3 (değiştirilemez yapılandırma)) bilerek YOKTUR. false'a dönünce kural dosyası silinir ve kurallar yeniden yüklenir; izinler gevşetilmez.
hardening_auditd_cis_l2: false
# İç ayar (izlenecek aday yollar; var olmayanlar atlanır, çünkü var olmayan yola kural eklemek yüklemeyi bozar).
hardening_auditd_l2_candidates:
  - /etc/issue
  - /etc/issue.net
  - /etc/hosts
  - /etc/networks
  - /etc/network/
  - /etc/netplan/
  - /etc/security/opasswd
  - /etc/nsswitch.conf
  - /etc/pam.conf
  - /etc/pam.d/
  - /var/run/utmp
  - /var/log/wtmp
  - /var/log/btmp
  - /var/log/faillog
  - /var/log/tallylog
  - /etc/apparmor/
  - /etc/apparmor.d/
  - /usr/bin/chcon
  - /usr/bin/setfacl
  - /usr/bin/chacl
  - /usr/sbin/usermod
  - /usr/bin/kmod
