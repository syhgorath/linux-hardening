# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# Kurallar yüklendikten sonra yeniden başlatılacak servisler (auditd'den ÖNCE başlayan süreçler yeniden başlatılana kadar denetlenmez).
# Boş = hiçbir şey yeniden başlatılmaz. Servis kesintisi yaratır; `ssh`/`sshd` yazmayın (bağlantı doğrulaması sonrası elle yapın).
hardening_auditd_restart_services: []
# true: GRUB_CMDLINE_LINUX'a `audit=1` ekler ve update-grub çalıştırır; etkisi YENİDEN BAŞLATMADAN sonra başlar, geri alma güvenlik ağı kapsamında DEĞİLDİR.
hardening_auditd_grub_audit: false
# true (varsayılan): Docker kuruluysa Docker dosyaları/dizinleri için izleme kuralı eklenir (CIS Docker 1.1.x). Yalnızca VAR OLAN yollar için yazılır
# (var olmayan yola kural eklemek yüklemeyi bozar). /var/lib/docker bilerek izlenmez (konteyner çalışırken çok gürültülü).
hardening_auditd_docker_rules: true
hardening_auditd_docker_paths:
  - /usr/bin/dockerd
  - /usr/bin/containerd
  - /usr/bin/containerd-shim
  - /usr/bin/containerd-shim-runc-v1
  - /usr/bin/containerd-shim-runc-v2
  - /usr/bin/runc
  - /etc/docker
  - /etc/docker/daemon.json
  - /etc/default/docker
  - /etc/containerd/config.toml
  - /usr/lib/systemd/system/docker.service
  - /usr/lib/systemd/system/docker.socket
  - /etc/systemd/system/docker.service
  - /etc/systemd/system/docker.socket
  - /run/docker.sock
  - /run/containerd/containerd.sock
