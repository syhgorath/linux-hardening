- name: Install auditd
  ansible.builtin.apt:
    name: [auditd, audispd-plugins]
    state: present

# Docker izleme kuralları: yalnızca var olan yollar (CIS Docker 1.1.x; /var/lib/docker hariç). `stat` salt okunur, --check'te de çalışır.
- name: Look for Docker files to audit
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ hardening_auditd_docker_paths }}"
  register: hardening_auditd_docker_stat
  when: hardening_auditd_docker_rules | bool

- name: Remember the Docker paths that exist
  ansible.builtin.set_fact:
    hardening_auditd_docker_existing: "{{ hardening_auditd_docker_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  when: hardening_auditd_docker_rules | bool

- name: Audit rules
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/60-hardening.rules
    owner: root
    group: root
    mode: "0640"
  register: hardening_auditd_rules_file

# --- CIS Level 2 (6.2.3.x kuralları, 6.2.4.x izinleri); varsayılan KAPALI. Karar mantığı files/audit_l2_rules.py ---
- name: CIS Level 2 audit rules and file permissions
  when: hardening_auditd_cis_l2 | bool
  block:
    - name: Read the machine architecture
      ansible.builtin.command: uname -m
      register: hardening_auditd_l2_arch
      changed_when: false
      check_mode: false

    - name: Look for the files to watch
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ (hardening_auditd_l2_candidates + [hardening_sudo_logfile | default('/var/log/sudo.log')]) | unique | list }}"
      register: hardening_auditd_l2_stat
      check_mode: false

    - name: Find setuid and setgid programs (read-only)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          mounts=$(findmnt -rn -o TARGET,FSTYPE,OPTIONS 2>/dev/null | awk '$2 ~ /^(ext[234]|xfs|btrfs|f2fs|zfs|overlay)$/ && $3 !~ /nosuid/ {print $1}')
          [ -n "$mounts" ] || mounts=/
          for m in $mounts; do find "$m" -xdev -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null; done | sort -u
        executable: /bin/bash
      register: hardening_auditd_l2_priv
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Build the Level 2 audit rules
      ansible.builtin.script:
        cmd: "audit_l2_rules.py {{ hardening_auditd_l2_input | to_json | quote }}"
        executable: python3
      vars:
        hardening_auditd_l2_input:
          arch: "{{ hardening_auditd_l2_arch.stdout | trim }}"
          has_b32: "{{ (hardening_auditd_l2_arch.stdout | trim) == 'x86_64' }}"
          paths: "{{ hardening_auditd_l2_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
          priv: "{{ hardening_auditd_l2_priv.stdout_lines | default([]) }}"
          sudo_logfile: "{{ hardening_sudo_logfile | default('/var/log/sudo.log') }}"
      register: hardening_auditd_l2_raw
      changed_when: false
      check_mode: false

    - name: Write the Level 2 audit rules
      ansible.builtin.copy:
        content: "{{ (hardening_auditd_l2_raw.stdout | from_json).rules }}"
        dest: /etc/audit/rules.d/61-hardening-cis-l2.rules
        owner: root
        group: root
        mode: "0640"
      register: hardening_auditd_l2_file

    # 6.2.4.x: günlük dizini ve dosyaları, yapılandırma dosyaları, araçlar (yalnızca izin KALDIRIR; olmayan yol atlanır)
    - name: Find audit log, configuration and tool files
      ansible.builtin.find:
        paths: "{{ item.paths }}"
        patterns: "{{ item.patterns }}"
        file_type: file
      loop:
        - { key: logs, paths: [/var/log/audit], patterns: ["*"] }
        - { key: conf, paths: [/etc/audit], patterns: ["*.conf"] }
        - { key: rules, paths: [/etc/audit/rules.d], patterns: ["*.rules"] }
        - { key: tools, paths: [/usr/sbin, /sbin], patterns: [auditctl, auditd, ausearch, aureport, autrace, augenrules] }
      loop_control:
        label: "{{ item.key }}"
      register: hardening_auditd_l2_files
      check_mode: false

    - name: Tighten the audit log directory (CIS 6.2.4 günlük dizini)
      ansible.builtin.file:
        path: /var/log/audit
        state: directory
        mode: "g-w,o-rwx"
      failed_when: false

    - name: Tighten audit log files (CIS 6.2.4 günlük dosyaları)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: root
        mode: "u-x,g-wx,o-rwx"
      loop: "{{ hardening_auditd_l2_files.results[0].files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Tighten audit configuration files (CIS 6.2.4 yapılandırma)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: root
        group: root
        mode: "u-x,g-wx,o-rwx"
      loop: "{{ hardening_auditd_l2_files.results[1].files + hardening_auditd_l2_files.results[2].files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Tighten audit tools (CIS 6.2.4 araçlar)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        owner: root
        group: root
        mode: "go-w"
        follow: false
      loop: "{{ hardening_auditd_l2_files.results[3].files }}"
      loop_control:
        label: "{{ item.path }}"

- name: Remove the Level 2 audit rules (option off)
  ansible.builtin.file:
    path: /etc/audit/rules.d/61-hardening-cis-l2.rules
    state: absent
  register: hardening_auditd_l2_removed
  when: not (hardening_auditd_cis_l2 | bool)

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  when: not ansible_check_mode

# Kurallar auditd başladıktan HEMEN SONRA yüklenir (handler değil): handler play sonunda çalışır ve arada fail2ban, aide, ufw, ssh
# değişiklikleri izlenmezdi (test VM'inde auditd başlangıcından 652 sn sonra). Tasarım: docs/design/auditd-kapsam.md (P3).
# `meta: flush_handlers` bilerek kullanılmaz: önceki rollerin bekleyen handler'larını da öne çekerdi.
- name: Read currently loaded audit rules
  ansible.builtin.command: auditctl -l
  register: hardening_auditd_loaded
  changed_when: false
  failed_when: false   # çekirdek denetimi yoksa (konteyner/LXC) okuma başarısız olur; o zaman yükleme görevi karar verir
  check_mode: false
  when: not ansible_check_mode

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: >-
    not ansible_check_mode and
    (hardening_auditd_rules_file is changed or hardening_auditd_l2_file is changed or hardening_auditd_l2_removed is changed or hardening_auditd_loaded.rc != 0 or 'No rules' in hardening_auditd_loaded.stdout)

# İsteğe bağlı (hardening_auditd_restart_services, varsayılan boş): auditd'den ÖNCE başlamış servisleri kurallar yüklendikten sonra yeniden başlatır,
# böylece denetlenmeye başlarlar. sshd bilerek yasak: erişim kaybı riski (docs/design/auditd-kapsam.md 1b).
- name: Refuse to restart ssh through the auditd role
  ansible.builtin.assert:
    that: >-
      hardening_auditd_restart_services
      | map('regex_replace', '\\.service$', '')
      | select('in', ['ssh', 'sshd', 'ssh.socket'])
      | list | length == 0
    fail_msg: >-
      hardening_auditd_restart_services içinde ssh/sshd olamaz (erişim kaybı riski). SSH'ı bağlantıyı doğruladıktan sonra elle yeniden başlatın.
  when: hardening_auditd_restart_services | length > 0

- name: Restart listed services so they are audited
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ hardening_auditd_restart_services }}"
  when: not ansible_check_mode and hardening_auditd_restart_services | length > 0

# Denetim kapsamı raporu (SALT OKUNUR; davranışı değiştirmez): auditd'den ÖNCE başlamış süreçler, yeniden başlatılana kadar denetlenmez
# (test VM'inde chronyd ile ölçüldü; çekirdek komut satırında audit=1 yoktu). Tasarım: docs/design/auditd-kapsam.md (P1, seçenek 1c).
# Çekirdek iş parçacıkları (ppid 2 / pid 2), auditd'in kendisi ve auditd'den en çok 5 sn önce başlayanlar sayılmaz.
# `--check`'te de çalışır (okuma): auditd kurulu değilse çıktı boştur.
- name: List processes started before auditd
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pid=$(systemctl show -p MainPID --value auditd 2>/dev/null)
      [ -n "$pid" ] && [ "$pid" != 0 ] || exit 0
      t=$(ps -o etimes= -p "$pid" | tr -d ' ')
      [ -n "$t" ] || exit 0
      ps -eo etimes=,ppid=,pid=,comm= | awk -v t="$t" '$2 != 2 && $3 != 2 && $1 > t + 5 { $1=$2=$3=""; sub(/^ +/, ""); print }' | sort -u
    executable: /bin/bash
  register: hardening_auditd_unaudited
  changed_when: false
  check_mode: false

- name: Warn that processes started before auditd are not audited
  ansible.builtin.debug:
    msg: >-
      UYARI (denetim kapsamı): {{ hardening_auditd_unaudited.stdout_lines | length }} program auditd'den ÖNCE başlamış ve yeniden başlatılana kadar
      denetlenmez, yani audit kuralları bunların sistem çağrılarını görmez
      (örnekler: {{ hardening_auditd_unaudited.stdout_lines[:12] | join(', ') }}). Önemli servisleri yeniden başlatın (örn. systemctl restart <servis>);
      sunucuyu yeniden başlatmak çoğunu kapsar ama çekirdek komut satırında audit=1 yoksa önyüklemenin erken süreçleri kapsam dışı kalabilir
      (doğrulanmadı). Ayrıntı: docs/design/auditd-kapsam.md (P1).
  when: hardening_auditd_unaudited.stdout_lines | length > 0

# İsteğe bağlı (hardening_auditd_grub_audit, varsayılan false): çekirdek komut satırına audit=1. Etkisi YENİDEN BAŞLATMADAN sonra başlar ve
# geri alma güvenlik ağı kapsamında DEĞİL (docs/design/auditd-kapsam.md 1a). /etc/default/grub yoksa (Raspberry Pi, LXC...) dokunulmaz.
- name: Check GRUB default file
  ansible.builtin.stat:
    path: /etc/default/grub
  register: hardening_auditd_grub_file
  when: hardening_auditd_grub_audit | bool

- name: Add audit=1 to GRUB_CMDLINE_LINUX (reboot required)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")((?:(?!\baudit=)[^"])*)"'
    replace: '\1\2 audit=1"'
  register: hardening_auditd_grub_edit
  when: hardening_auditd_grub_audit | bool and hardening_auditd_grub_file.stat.exists

- name: Regenerate GRUB configuration
  ansible.builtin.command: update-grub
  changed_when: true
  when: not ansible_check_mode and hardening_auditd_grub_edit is changed

- name: Tell that audit=1 needs a reboot
  ansible.builtin.debug:
    msg: >-
      UYARI: GRUB_CMDLINE_LINUX'a audit=1 eklendi; etkisi sunucuyu YENİDEN BAŞLATTIKTAN sonra başlar. Bu ayar geri alma güvenlik ağı kapsamında değildir;
      geri almak için /etc/default/grub içinden audit=1'i silip update-grub çalıştırın.
  when: (hardening_auditd_grub_edit | default({})).get('changed', false)

- name: Warn that GRUB is not available for audit=1
  ansible.builtin.debug:
    msg: "UYARI: hardening_auditd_grub_audit=true ama /etc/default/grub yok (GRUB kullanılmıyor olabilir); audit=1 eklenmedi."
  when: hardening_auditd_grub_audit | bool and not hardening_auditd_grub_file.stat.exists
