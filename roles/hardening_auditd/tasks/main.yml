- name: Install auditd
  ansible.builtin.apt:
    name: [auditd, audispd-plugins]
    state: present

- name: Audit rules
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/60-hardening.rules
    owner: root
    group: root
    mode: "0640"
  register: hardening_auditd_rules_file

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  when: not ansible_check_mode

# Kurallar auditd başladıktan HEMEN SONRA yüklenir (handler değil): handler play sonunda çalışır ve arada fail2ban, aide, ufw, ssh
# değişiklikleri izlenmezdi (test VM'inde auditd başlangıcından 652 sn sonra). Tasarım: docs/design/auditd-kapsam.md (P3).
# `meta: flush_handlers` bilerek kullanılmaz: önceki rollerin bekleyen handler'larını da öne çekerdi.
- name: Read currently loaded audit rules
  ansible.builtin.command: auditctl -l
  register: hardening_auditd_loaded
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: >-
    not ansible_check_mode and
    (hardening_auditd_rules_file is changed or 'No rules' in hardening_auditd_loaded.stdout)

# İsteğe bağlı (hardening_auditd_restart_services, varsayılan boş): auditd'den ÖNCE başlamış servisleri kurallar yüklendikten sonra yeniden başlatır,
# böylece denetlenmeye başlarlar. sshd bilerek yasak: erişim kaybı riski (docs/design/auditd-kapsam.md 1b).
- name: Refuse to restart ssh through the auditd role
  ansible.builtin.assert:
    that: >-
      hardening_auditd_restart_services
      | map('regex_replace', '\\.service$', '')
      | select('in', ['ssh', 'sshd', 'ssh.socket'])
      | list | length == 0
    fail_msg: >-
      hardening_auditd_restart_services içinde ssh/sshd olamaz (erişim kaybı riski). SSH'ı bağlantıyı doğruladıktan sonra elle yeniden başlatın.
  when: hardening_auditd_restart_services | length > 0

- name: Restart listed services so they are audited
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ hardening_auditd_restart_services }}"
  when: not ansible_check_mode and hardening_auditd_restart_services | length > 0

# Denetim kapsamı raporu (SALT OKUNUR; davranışı değiştirmez): auditd'den ÖNCE başlamış süreçler, yeniden başlatılana kadar denetlenmez
# (test VM'inde chronyd ile ölçüldü; çekirdek komut satırında audit=1 yoktu). Tasarım: docs/design/auditd-kapsam.md (P1, seçenek 1c).
# Çekirdek iş parçacıkları (ppid 2 / pid 2), auditd'in kendisi ve auditd'den en çok 5 sn önce başlayanlar sayılmaz.
# `--check`'te de çalışır (okuma): auditd kurulu değilse çıktı boştur.
- name: List processes started before auditd
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pid=$(systemctl show -p MainPID --value auditd 2>/dev/null)
      [ -n "$pid" ] && [ "$pid" != 0 ] || exit 0
      t=$(ps -o etimes= -p "$pid" | tr -d ' ')
      [ -n "$t" ] || exit 0
      ps -eo etimes=,ppid=,pid=,comm= | awk -v t="$t" '$2 != 2 && $3 != 2 && $1 > t + 5 { $1=$2=$3=""; sub(/^ +/, ""); print }' | sort -u
    executable: /bin/bash
  register: hardening_auditd_unaudited
  changed_when: false
  check_mode: false

- name: Warn that processes started before auditd are not audited
  ansible.builtin.debug:
    msg: >-
      UYARI (denetim kapsamı): {{ hardening_auditd_unaudited.stdout_lines | length }} program auditd'den ÖNCE başlamış ve yeniden başlatılana kadar
      denetlenmez, yani audit kuralları bunların sistem çağrılarını görmez
      (örnekler: {{ hardening_auditd_unaudited.stdout_lines[:12] | join(', ') }}). Önemli servisleri yeniden başlatın (örn. systemctl restart <servis>);
      sunucuyu yeniden başlatmak çoğunu kapsar ama çekirdek komut satırında audit=1 yoksa önyüklemenin erken süreçleri kapsam dışı kalabilir
      (doğrulanmadı). Ayrıntı: docs/design/auditd-kapsam.md (P1).
  when: hardening_auditd_unaudited.stdout_lines | length > 0

# İsteğe bağlı (hardening_auditd_grub_audit, varsayılan false): çekirdek komut satırına audit=1. Etkisi YENİDEN BAŞLATMADAN sonra başlar ve
# geri alma güvenlik ağı kapsamında DEĞİL (docs/design/auditd-kapsam.md 1a). /etc/default/grub yoksa (Raspberry Pi, LXC...) dokunulmaz.
- name: Check GRUB default file
  ansible.builtin.stat:
    path: /etc/default/grub
  register: hardening_auditd_grub_file
  when: hardening_auditd_grub_audit | bool

- name: Add audit=1 to GRUB_CMDLINE_LINUX (reboot required)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")((?:(?!\baudit=)[^"])*)"'
    replace: '\1\2 audit=1"'
  register: hardening_auditd_grub_edit
  when: hardening_auditd_grub_audit | bool and hardening_auditd_grub_file.stat.exists

- name: Regenerate GRUB configuration
  ansible.builtin.command: update-grub
  changed_when: true
  when: not ansible_check_mode and hardening_auditd_grub_edit is changed

- name: Tell that audit=1 needs a reboot
  ansible.builtin.debug:
    msg: >-
      UYARI: GRUB_CMDLINE_LINUX'a audit=1 eklendi; etkisi sunucuyu YENİDEN BAŞLATTIKTAN sonra başlar. Bu ayar geri alma güvenlik ağı kapsamında değildir;
      geri almak için /etc/default/grub içinden audit=1'i silip update-grub çalıştırın.
  when: (hardening_auditd_grub_edit | default({})).get('changed', false)

- name: Warn that GRUB is not available for audit=1
  ansible.builtin.debug:
    msg: "UYARI: hardening_auditd_grub_audit=true ama /etc/default/grub yok (GRUB kullanılmıyor olabilir); audit=1 eklenmedi."
  when: hardening_auditd_grub_audit | bool and not hardening_auditd_grub_file.stat.exists
