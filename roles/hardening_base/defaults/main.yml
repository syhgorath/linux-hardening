# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# true (varsayılan): usb-storage çekirdek modülü yüklenemez (CIS 1.1.1, usb-storage; USB diske yedek/kurtarma çalışmaz). false: bu rolün yazdığı kural DOSYASI silinir
# (yüklü olmayan modül tekrar yüklenebilir; çalışan çekirdekte hemen etki etmeyebilir).
hardening_disable_usb_storage: true
# true: Ubuntu hata raporlayıcı apport'u kapatır (/etc/default/apport enabled=0, servis durdurulur ve maskelenir; CIS 1.5.7). Çökme raporları toplanmaz.
hardening_disable_apport: true
# true: update-notifier-motd zamanlayıcısını durdurup maskeler (CIS 1.6.12). Oturum açılışındaki "güncelleme var" ileti güncellemesi durur.
hardening_disable_update_notifier_motd: true
# true: SUID/SGID dosyalarının SALT OKUNUR özetini yazdırır (CIS 7.1.13, "gözden geçir"). Hiçbir şeyi değiştirmez; çok büyük dosya sistemlerinde en çok 120 sn sürer.
hardening_suid_report: true
# true: düz metin istemcileri (telnet, ftp) KALDIRILIR (apt remove; purge DEĞİL, ayar dosyalarına dokunulmaz; CIS 2.2). Varsayılan kapalı.
# Port açmazlar (tek başlarına güvenlik riski değil) ama `telnet host port` ile port yoklayan betikleri ve `ftp` yedek akışlarını KIRAR. Geri alma: apt install.
hardening_remove_legacy_clients: false
# ftp-ssl ve telnet-ssl: aynı komutu (`ftp`/`telnet`) update-alternatives ile sağlarlar; yalnızca `ftp`/`telnet` kaldırılınca komut onlara düşüyordu (gerçek VM'de görüldü).
# ubuntu-standard: bir ftp istemcisi ister (`ftp | ftp-ssl | tnftp`); onu listede tutmazsanız apt, bir istemciyi kaldırınca bir ÖBÜRÜNÜ kurar ve her koşuda
# ping-pong yapar (gerçek VM'de görüldü: ftp -> ftp-ssl -> ftp+tnftp ...). Bu bir METAPAKETTİR (dosya içermez); kalkınca bağımlılıkları sunucuda kalır, ama
# `apt autoremove` onlardan otomatik kurulmuş olanları aday gösterebilir. İstemiyorsanız hardening_remove_legacy_clients'i açmayın.
hardening_legacy_client_packages: [telnet, telnet-ssl, inetutils-telnet, ftp, ftp-ssl, tnftp, inetutils-ftp, ubuntu-standard]
# true (varsayılan): apt-listchanges kurulur (Lynis DEB-0811) ve yükseltmeyi ASLA BLOKLAMAYACAK şekilde ayarlanır (frontend=text, confirm=false, e-posta yok):
# yükseltilen paketlerin değişiklik notları apt çıktısında/günlüğünde (/var/log/apt/term.log) görünür. Bilgilendirmedir, güvenlik denetimi değildir.
# apt-listbugs Ubuntu 26.04 depolarında YOK (Lynis DEB-0810 Ubuntu için uygulanamaz); eklenmez.
hardening_apt_listchanges: true
# true (varsayılan): debsums kurulur (Lynis PKGS-7370: paket dosyalarını dpkg'nin bilinen-iyi toplamlarıyla doğrular) ve /etc/default/debsums içinde CRON_CHECK
# hardening_debsums_cron_check değerine (daily|weekly|monthly; "never" = zamanlama yok) ayarlanır. Kurulum zararsızdır; zamanlanmış kontrol haftada bir disk okur.
hardening_debsums: true
hardening_debsums_cron_check: weekly
# true (varsayılan): apt-show-versions kurulur (Lynis PKGS-7394: yükseltilebilir paketleri listeler; yama takibi için). Salt okunur araç.
hardening_apt_show_versions: true
# true (varsayılan): acct kurulur ve acct.service etkinleştirilir (Lynis ACCT-9622: süreç muhasebesi, /var/log/account/pacct). Günlük yazılır; logrotate paketle gelir.
hardening_process_accounting: true
# false (varsayılan, warn_if): true iken her koşuda `apt-get upgrade` çalışır (dist-upgrade DEĞİL; paket kaldırmaz). Servisler yeniden başlayabilir (Docker/MySQL/nginx dahil), yeni çekirdek
# yeniden başlatma ister (yeniden başlatılmaz; /var/run/reboot-required varsa UYARI). Lynis PKGS-7392 bekleyen güvenlik güncellemesi için en ağır puan kalemidir (25 puan).
hardening_apt_upgrade: false
# none (varsayılan) | rkhunter: rkhunter kurulur (Lynis HRDN-7230), günlük kontrol (cron.daily) ve apt sonrası özet veritabanı güncellemesi açılır, ilk veritabanı üretilir.
# Sonuç /var/log/rkhunter.log dosyasındadır. Kendi başına bütünlük/rootkit izi taraması yapar; AIDE ve auditd'in yerini tutmaz. ClamAV bu pakette YOKTUR (dosya yükleme servisine aittir).
# none'a dönmek rkhunter'ı KALDIRMAZ (kurulu paket ve ayarlar kalır).
hardening_malware_scanner: none
# true (varsayılan): postfix kuruluysa SMTP banner'ı `$myhostname ESMTP` yapılır (Lynis MAIL-8818: banner yazılım/işletim sistemi adını sızdırmasın). Yalnızca banner metnini değiştirir.
# Postfix kurulu değilse (Ubuntu'da MTA dma) hiçbir şey yapılmaz. false: dokunulmaz (eski banner geri yazılmaz).
hardening_postfix_banner: true
# journald günlük döndürme/sınırları (CIS 6.1.1.1.5), varsayılan KAPALI: true iken /etc/systemd/journald.conf.d/61-hardening-rotation.conf yazılır
# (SystemMaxUse, RuntimeMaxUse, MaxFileSec). Sınırı aşan ESKİ günlükler silinir (saklama süresi kısalır). false: dosya silinir, systemd varsayılanı geçerli olur.
# Boyutlar: sayı + K|M|G|T (örn. 1G, 200M); MaxFileSec: sayı + s|min|h|day|week|month|year (örn. 1month).
hardening_journald_rotation: false
hardening_journald_system_max_use: "1G"
hardening_journald_runtime_max_use: "200M"
hardening_journald_max_file_sec: "1month"
# Girişte gösterilen MOTD betiklerinden kapatılacaklar (CIS 1.6.4): /etc/update-motd.d içindeki adlar (örn. ["00-header", "10-help-text"]). Varsayılan BOŞ = dokunulmaz.
# Kapatmak betiğin çalıştırma iznini kaldırır (silinmez; paket güncellemesi izni geri vermez); giriş mesajı değişir. Geri almak için listeden çıkarıp `chmod +x` ile iade edilir (rol açmaz).
hardening_motd_disable_scripts: []
# İç ayar (testlerde değiştirilir).
hardening_motd_dir: /etc/update-motd.d
