# Sistemde bir mail-transport-agent bagimliligi var; postfix'i sadece kaldirmak apt'e
# courier-mta (25/tcp dinler) kurdurdu. Dinlemeyen bir MTA (dma) ile karsilaniyor.
# Proxmox VE'de MTA DEĞİŞTİRİLMEZ: pve-manager bir MTA'ya bağımlıdır ve postfix'i tek başına kaldırmak pve-manager ile proxmox-ve'yi de kaldırır (verification-log 41).
- name: Install dma (sadece giden mail, port dinlemez)
  ansible.builtin.apt:
    name: dma
    state: present
  when: hardening_platform | default('generic') != 'proxmox-host'

- name: Purge listening MTAs (postfix, courier)
  ansible.builtin.apt:
    name: [postfix, "courier-*"]
    state: absent
    purge: true
    autoremove: true
  when: hardening_platform | default('generic') != 'proxmox-host'

# cron: AIDE (hardening_aide, sonra çalışır) onu bağımlılık olarak getirir; minimal imajda yoksa hardening_files cron izinlerini (CIS bölüm 2.4) İLK koşuda göremez
# ve ikinci koşuda sıkılaştırırdı (verification-log 45). Önce kurulur ki hardening_files aynı koşuda sıkılaştırsın. Zaten kuruluysa değişiklik yok.
- name: Install cron (AIDE needs it; installed first so its file permissions are tightened in the same run)
  ansible.builtin.apt:
    name: cron
    state: present

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates (otomatik reboot YOK)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Disable usb-storage
  ansible.builtin.copy:
    dest: /etc/modprobe.d/60-hardening-usb.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible tarafından yönetilir
      install usb-storage /bin/false
      blacklist usb-storage
  when: hardening_disable_usb_storage | bool and not (hardening_platform_relaxed | default(false) | bool) and not (hardening_rpi_relaxed | default(false) | bool)

- name: Allow usb-storage (remove this role's rule file)
  ansible.builtin.file:
    path: /etc/modprobe.d/60-hardening-usb.conf
    state: absent
  when: not (hardening_disable_usb_storage | bool)

- name: Legal banner
  ansible.builtin.copy:
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Authorized use only. Activity on this system is monitored and logged.
      Unauthorized access is prohibited.
  loop:
    - /etc/issue
    - /etc/issue.net

# CIS 6.1.1.1.6 / 6.1.1.1.7: journald kalıcı depolama ve sıkıştırma AÇIKÇA yazılır. `Storage=auto` yalnızca /var/log/journal varsa kalıcıdır (bazı bulut imajlarında yoktur).
# Veri kaybı yok: günlükler diske yazılır; saklama süresi/boyut ayarlarına dokunulmaz (site politikası).
- name: Ensure journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Persistent, compressed journald storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible tarafından yönetilir
      [Journal]
      Storage=persistent
      Compress=yes
  notify: Restart journald

# CIS 6.1.1.1.5: journald döndürme/boyut sınırları. Varsayılan KAPALI (günlük saklama süresini etkiler); kapalıyken yalnızca bu rolün dosyası silinir.
- name: Validate the journald rotation settings
  ansible.builtin.assert:
    that:
      - hardening_journald_rotation in [true, false]
      - hardening_journald_system_max_use | string is match('^[0-9]+[KMGT]$')
      - hardening_journald_runtime_max_use | string is match('^[0-9]+[KMGT]$')
      - hardening_journald_max_file_sec | string is match('^[0-9]+(s|min|h|day|week|month|year)$')
    fail_msg: >-
      journald ayarları geçersiz: hardening_journald_rotation bool; hardening_journald_system_max_use ve _runtime_max_use sayı + K|M|G|T (örn. 1G); hardening_journald_max_file_sec sayı + s|min|h|day|week|month|year (örn. 1month).

- name: Write journald rotation limits
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/61-hardening-rotation.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible tarafından yönetilir
      [Journal]
      SystemMaxUse={{ hardening_journald_system_max_use }}
      RuntimeMaxUse={{ hardening_journald_runtime_max_use }}
      MaxFileSec={{ hardening_journald_max_file_sec }}
  when: hardening_journald_rotation | bool
  notify: Restart journald

- name: Remove journald rotation limits (this role's file)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/61-hardening-rotation.conf
    state: absent
  when: not (hardening_journald_rotation | bool)
  notify: Restart journald

# CIS 1.6.4: girişte gösterilen MOTD betiklerinden istenenler kapatılır (çalıştırma izni kaldırılır). Varsayılan boş: dokunulmaz. Olmayan ad atlanır.
- name: Validate the MOTD script names
  ansible.builtin.assert:
    that:
      - hardening_motd_disable_scripts is sequence and hardening_motd_disable_scripts is not string
      - hardening_motd_disable_scripts | reject('match', '^[A-Za-z0-9][A-Za-z0-9._-]*$') | list | length == 0
    fail_msg: "hardening_motd_disable_scripts geçersiz: liste olmalı, girdiler yalnızca dosya adı olmalı (harf, rakam, nokta, _ ve -; yol ya da '..' yok)."

- name: Look for the MOTD scripts
  ansible.builtin.stat:
    path: "{{ hardening_motd_dir }}/{{ item }}"
  loop: "{{ hardening_motd_disable_scripts }}"
  register: hardening_motd_stat
  check_mode: false

- name: Disable the listed MOTD scripts (remove the execute bit)
  ansible.builtin.file:
    path: "{{ hardening_motd_dir }}/{{ item.item }}"
    state: file
    mode: "a-x"
    follow: false
  loop: "{{ hardening_motd_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isreg | default(false)

# Önce DURDUR, sonra MASKELE (ayrı görevler): tek çağrıda maskelemek zamanlayıcıyı "Unit to trigger vanished" ile `failed` bırakıp `systemctl --failed`te gösteriyordu (gerçek VM'de görüldü).
# --- Küçük servis kapatmaları (CIS 1.5.7 apport, 1.6.12 update-notifier-motd) ve SUID/SGID özeti (7.1.13, salt okunur) ---
# Birimler her dağıtımda yoktur: önce durumları (salt okunur) okunur, `LoadState` boş/not-found ise dokunulmaz.
- name: Read apport.service state (read-only)
  ansible.builtin.systemd:
    name: apport.service
  register: hardening_base_apport_unit
  failed_when: false
  check_mode: false

- name: Read update-notifier-motd.timer state (read-only)
  ansible.builtin.systemd:
    name: update-notifier-motd.timer
  register: hardening_base_motd_unit
  failed_when: false
  check_mode: false

- name: Check apport defaults file
  ansible.builtin.stat:
    path: /etc/default/apport
  register: hardening_base_apport_file
  when: hardening_disable_apport | bool

- name: Disable apport in its defaults file
  ansible.builtin.lineinfile:
    path: /etc/default/apport
    regexp: '^\s*enabled\s*='
    line: enabled=0
  when: hardening_disable_apport | bool and hardening_base_apport_file.stat.exists

- name: Stop apport.service
  ansible.builtin.systemd:
    name: apport.service
    state: stopped
  when: hardening_disable_apport | bool and (hardening_base_apport_unit.status | default({})).LoadState | default('') != 'not-found' and (hardening_base_apport_unit.status | default({})).LoadState | default('') != ''

- name: Mask apport.service
  ansible.builtin.systemd:
    name: apport.service
    masked: true
  when: hardening_disable_apport | bool and (hardening_base_apport_unit.status | default({})).LoadState | default('') != 'not-found' and (hardening_base_apport_unit.status | default({})).LoadState | default('') != ''

- name: Stop update-notifier-motd.timer
  ansible.builtin.systemd:
    name: update-notifier-motd.timer
    state: stopped
  when: hardening_disable_update_notifier_motd | bool and (hardening_base_motd_unit.status | default({})).LoadState | default('') != 'not-found' and (hardening_base_motd_unit.status | default({})).LoadState | default('') != ''

- name: Mask update-notifier-motd.timer
  ansible.builtin.systemd:
    name: update-notifier-motd.timer
    masked: true
  when: hardening_disable_update_notifier_motd | bool and (hardening_base_motd_unit.status | default({})).LoadState | default('') != 'not-found' and (hardening_base_motd_unit.status | default({})).LoadState | default('') != ''

- name: List SUID/SGID files (read-only)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      timeout 120 find / -xdev -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null | sort || true
    executable: /bin/bash
  register: hardening_base_suid
  changed_when: false
  check_mode: false
  when: hardening_suid_report | bool

- name: Show SUID/SGID summary
  ansible.builtin.debug:
    msg: >-
      SUID/SGID (CIS 7.1.13, gözden geçirin): {{ hardening_base_suid.stdout_lines | length }} dosya.
      Beklenmeyen bir program varsa inceleyin. İlk 40: {{ hardening_base_suid.stdout_lines[:40] | join(', ') }}
  when: hardening_suid_report | bool

# Düz metin istemcilerini kaldır (varsayılan KAPALI). `remove` (purge değil); bağımlı paket varsa apt onları da listeler/kaldırır, bu yüzden autoremove KAPALI.
- name: Remove legacy plaintext clients (telnet, ftp)
  ansible.builtin.apt:
    name: "{{ hardening_legacy_client_packages }}"
    state: absent
    purge: false
    autoremove: false
  when: hardening_remove_legacy_clients | bool

# --- apt-listchanges (bilgilendirme; yükseltmeyi bloklamaz) ---
- name: Install apt-listchanges
  ansible.builtin.apt:
    name: apt-listchanges
    state: present
  when: hardening_apt_listchanges | bool

- name: Configure apt-listchanges (never prompts, no mail)
  ansible.builtin.copy:
    dest: /etc/apt/listchanges.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible tarafından yönetilir
      [apt]
      frontend=text
      confirm=false
      which=both
      save_seen=/var/lib/apt/listchanges.db
  when: hardening_apt_listchanges | bool
