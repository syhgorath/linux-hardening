# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# ZORUNLU: SSH'a izin verilen ağlar; diğer her şey gelen trafikte engellenir.
# Bilerek BOŞ: boşken harden.yml (ufw/ssh) hata verip durur (bkz. roles/hardening_preflight/tasks/access.yml).
# NOT: hardening_ssh_port KALDIRILDI; ufw kuralı sshd'nin gerçekten dinlediği porttan yazılır, port değiştirme desteklenmez.
# Bu değişkeni preflight da okur (kaynak IP kontrolü); tek sahibi bu rol, orada tanımsızsa boş sayılır.
hardening_ssh_allow_from: []
# Ek açılacak portlar/kurallar. Biçimler: "443/tcp", "80", "8000:8010/tcp" ya da kaynak kısıtlı "from 192.0.2.5 to any port 6379 proto tcp"
# (kaynak: IP, CIDR ya da any). Bu liste grup/ortak ayarlar içindir; sunucuya ÖZEL kurallar için hardening_ufw_extra_allow_host kullanın:
# Ansible liste değişkenlerini BİRLEŞTİRMEZ, üzerine yazar; host_vars'a hardening_ufw_extra_allow yazarsanız grubunki silinir.
hardening_ufw_extra_allow: []
# Yalnızca bu sunucuya özel ek kurallar (host_vars). Rol, extra_allow ile BİRLEŞTİRİR (tekrarlar atılır).
hardening_ufw_extra_allow_host: []
# Geçerli kural biçimi (iç ayar; rol her girdiyi bununla doğrular, uymayan girdide ufw'ye hiç dokunmadan durur).
hardening_ufw_extra_allow_pattern: '^([0-9]{1,5}(:[0-9]{1,5})?(/(tcp|udp))?|from (any|[0-9A-Fa-f:.]+(/[0-9]{1,3})?) to any port [0-9]{1,5}(:[0-9]{1,5})? proto (tcp|udp))$'
# false (varsayılan): allow_from'da olmayan, bu rolün yazdığı biçimdeki SSH kuralları için yalnızca UYARIR.
# true: bu kuralları SİLER (kontrol makinesinin adresini kapsayanlara, extra_allow'dakilere ve biçime uymayanlara dokunulmaz).
# Silmeden sonra allow_from'daki her ağın kuralı yerinde değilse rol ufw'yi etkinleştirmeden durur.
hardening_ufw_prune_ssh: false
# true: yönlendirilen (routed/forward) trafik için varsayılan ilke deny (CIS 4.1.5). Ubuntu'da zaten deny gelir; false = ufw'nin ayarına dokunulmaz
# (ufw ile yönlendirme/NAT/köprü yapan, bunu bilerek ACCEPT bırakmış sunucular için).
hardening_ufw_routed_deny: true
# true (varsayılan): ufw'nin kendi /etc/ufw/sysctl.conf dosyasında net/ipv4/conf/{all,default}/log_martians=1 yapılır ve canlı değer düzeltilir (CIS 3.3.1).
# ufw dosyası aksi halde değeri 0'a çeker ve sysctl.d'deki 1'i ezer. Hatalı kaynak adresli paketler günlüğe yazılır (gürültülü ağlarda günlük şişebilir). false: dokunulmaz.
hardening_ufw_log_martians: true
