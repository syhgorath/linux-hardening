# Varsayılanlar. Geçersiz kılmak için: group_vars/host_vars, -e veya -e @dosya.yml (bkz. HOWTO.md).
# ZORUNLU: SSH'a izin verilen ağlar; diğer her şey gelen trafikte engellenir.
# Bilerek BOŞ: boşken harden.yml (ufw/ssh) hata verip durur (bkz. roles/hardening_preflight/tasks/access.yml).
# NOT: hardening_ssh_port KALDIRILDI; ufw kuralı sshd'nin gerçekten dinlediği porttan yazılır, port değiştirme desteklenmez.
# Bu değişkeni preflight da okur (kaynak IP kontrolü); tek sahibi bu rol, orada tanımsızsa boş sayılır.
hardening_ssh_allow_from: []
# Ek açılacak portlar, örn: ["443/tcp"]
hardening_ufw_extra_allow: []
# false (varsayılan): allow_from'da olmayan, bu rolün yazdığı biçimdeki SSH kuralları için yalnızca UYARIR.
# true: bu kuralları SİLER (kontrol makinesinin adresini kapsayanlara, extra_allow'dakilere ve biçime uymayanlara dokunulmaz).
# Silmeden sonra allow_from'daki her ağın kuralı yerinde değilse rol ufw'yi etkinleştirmeden durur.
hardening_ufw_prune_ssh: false
