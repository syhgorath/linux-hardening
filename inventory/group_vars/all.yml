# hardening_pass_min_days: 1
# hardening_pass_warn_age: 7
# hardening_umask: "027"
# hardening_pwquality_minlen: 14

# --- fail2ban ---
# Buradan gelen IP'ler asla banlanmaz (erişim kaybını önler).
# hardening_fail2ban_ignoreip: "127.0.0.1/8 ::1 10.0.0.0/8"
# hardening_fail2ban_maxretry: 5
# hardening_fail2ban_bantime: 1h

