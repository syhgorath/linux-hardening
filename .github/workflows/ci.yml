name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Hash'li kurulum (requirements-dev.txt)
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
          .venv/bin/ansible-playbook --version
      - name: Testler (lint, sözdizimi, korumalar, şablonlar, özet, etiket, paket, hijyen)
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          test/run-all.sh

  linux-smoke:
    # Gerçek bir Linux'ta (runner Ubuntu 24.04) harden.yml'i YALNIZCA --check ile çalıştırır:
    # temiz sunucuda failed=0 (PR-0c), gerçek `ss -p` ve ufw/ssh okumaları. Hiçbir değişiklik uygulanmaz.
    # Runner 24.04 olduğu için destek sınırı bu iş için bilerek aşılır.
    name: linux-smoke (--check, uygulama yok)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Hash'li kurulum
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
      - name: Runner hazırlığı (sshd dinlesin, authorized_keys olsun)
        run: |
          sudo systemctl start ssh || sudo systemctl start sshd
          sudo ss -H -tln -p | grep sshd || { echo "sshd dinlemiyor"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/ci_smoke_key
          cat ~/.ssh/ci_smoke_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          cp vars/ubuntu-26.04.yml vars/ubuntu-24.04.yml
      - name: harden.yml --check --diff (temiz sunucu)
        env:
          SSH_CONNECTION: "192.0.2.10 5555 192.0.2.20 22"
        run: |
          set -o pipefail
          .venv/bin/ansible-playbook -i test/inventory-local.yml playbooks/harden.yml --check --diff \
            -e hardening_allow_unsupported=true \
            -e '{"hardening_ssh_allow_from": ["192.0.2.0/24"]}' \
            -e ansible_python_interpreter=/usr/bin/python3 | tee smoke.log
          grep -E 'failed=0' smoke.log
      - name: Etiketli çalıştırma (--tags ssh) korumaları atlamamalı
        env:
          SSH_CONNECTION: "192.0.2.10 5555 192.0.2.20 22"
        run: |
          set +e
          out=$(.venv/bin/ansible-playbook -i test/inventory-local.yml playbooks/harden.yml --check --tags ssh \
            -e hardening_allow_unsupported=true -e ansible_python_interpreter=/usr/bin/python3 2>&1)
          echo "$out" | tail -20
          echo "$out" | grep -q "boş veya tanımsız"
